<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" id="themeColorMeta" content="#FFFFFF">
<title>UE跑跑算</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1F24;
    --panel:#23282F;
    --panel-2:#2C333C;
    --text:#EDEFF2;
    --muted:#8A929C;
    --amber:#FFB020;
    --amber-dim:#4A3A18;
    --green:#3DDC97;
    --green-dim:#1C3A2E;
    --red:#FF5C5C;
    --border:#343B44;
    --brand-uber-color:#fff;
    --on-green:#0C2A1E;
    --on-amber:#412402;
    --on-red:#3A0F0F;
  }
  html[data-theme="light"]{
    --bg:#FFFFFF;
    --panel:#FFFFFF;
    --panel-2:#F1F2F4;
    --text:#1B1F24;
    --muted:#6B7280;
    --amber:#92600A;
    --amber-dim:#FFF3D9;
    --green:#3B814B;
    --green-dim:#E4F2E8;
    --red:#C23A3A;
    --border:#E1E3E6;
    --brand-uber-color:#1B1F24;
    --on-green:#fff;
    --on-amber:#fff;
    --on-red:#fff;
  }
  html[data-theme="cyberpunk"]{
    --bg:#0A0E17;
    --panel:#140B28;
    --panel-2:#1F0F35;
    --text:#E8F4FF;
    --muted:#9A8BC2;
    --amber:#FF2A6D;
    --amber-dim:#3D0A22;
    --green:#05D9E8;
    --green-dim:#062830;
    --red:#FF3C64;
    --border:#331E52;
    --brand-uber-color:#05D9E8;
    --on-green:#0A0E17;
    --on-amber:#0A0E17;
    --on-red:#0A0E17;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
    transition: padding-bottom 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
  }
  .app{width:100%;max-width:480px;padding:20px 16px 60px;}
  .icon-btn{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    width:38px;height:38px;border-radius:10px;font-size:17px;cursor:pointer;flex-shrink:0;
  }
  .icon-btn:active{transform:scale(0.96);}

  .new-order-btn{
    flex:1;padding:16px 8px;border-radius:16px;border:2px dashed var(--amber);
    background:transparent;color:var(--amber);font-weight:600;font-size:15px;
    cursor:pointer;font-family:inherit;
  }
  .new-order-btn:active{background:var(--amber-dim);}

  .trash-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;margin-bottom:10px;
  }
  .trash-info{min-width:0;flex:1;}
  .trash-ordno{font-size:15px;font-weight:700;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif;font-variant-numeric:tabular-nums;}
  .trash-meta{font-size:12px;color:var(--muted);margin-top:4px;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif;font-variant-numeric:tabular-nums;}
  .trash-restore-btn{
    flex:0 0 auto;background:var(--green);color:var(--on-green);border:none;
    border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;
    cursor:pointer;font-family:inherit;
  }
  .trash-restore-btn:active{transform:scale(0.96);}
  .new-order-row{display:flex;gap:10px;margin-bottom:18px;}
  .linked-btn{
    flex:1;padding:16px 8px;border-radius:16px;border:2px dashed var(--green);
    background:transparent;color:var(--green);font-weight:600;font-size:15px;
    cursor:pointer;font-family:inherit;
  }
  .linked-btn:active{background:var(--green-dim);}
  .link-badge{
    display:inline-block;font-size:11px;font-weight:600;color:var(--green);
    background:var(--green-dim);border-radius:6px;padding:2px 7px;margin-left:8px;
  }

  .active-header{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px;}
  .active-header h2{font-size:14px;color:var(--muted);font-weight:600;margin:0;}
  .active-header .count{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif;font-variant-numeric:tabular-nums;font-size:13px;color:var(--amber);}

  .swipe-card-wrap{position:relative;margin-bottom:10px;border-radius:14px;overflow:hidden; transition: background-color 0.2s ease;}
  .order-card{
    position:relative;background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:12px 14px;touch-action:pan-y; z-index:1; /* 保證卡片在底色上方 */
  }
  .ordno-price-row{display:flex;gap:8px;margin-bottom:10px;}
  
  /* 輸入框樣式優化：原生游標回歸、發光外框 */
  .ordno-input, .price-input { 
    cursor: text; 
    caret-color: var(--amber);
  }
  
  .ordno-input.vk-active, .price-input-wrap.vk-active {
    border-color: var(--amber) !important;
    box-shadow: 0 0 0 1px var(--amber);
  }

  .ordno-input{
    flex:1.8;min-width:0;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;
    padding:8px 10px;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif;font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;
    text-align:center;letter-spacing:1px;color:var(--text);
  }
  .ordno-input:focus{outline:none;}
  .ordno-input::placeholder{font-weight:400;font-size:13px;letter-spacing:normal;}
  
  .price-input-wrap{
    flex:0.8;min-width:0;display:flex;align-items:center;gap:2px;
    background:var(--panel-2);border:1px solid var(--border);border-radius:10px;
    padding:8px 10px; transition: border-color 0.2s, box-shadow 0.2s;
  }
  .price-input-wrap span{font-size:14px;color:var(--muted);}
  
  .price-input-wrap.locked-price {
    opacity: 0.5;
    pointer-events: none;
  }

  .price-input{
    flex:1;min-width:0;width:100%;background:transparent;border:none;outline:none !important;
    color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif;font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;
    text-align:right;-moz-appearance:textfield;appearance:textfield;
  }
  .price-input::-webkit-outer-spin-button,.price-input::-webkit-inner-spin-button{
    -webkit-appearance:none;margin:0;
  }
  .price-input::placeholder{font-weight:400;font-size:13px;letter-spacing:normal;}
  
  .order-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .order-start{font-size:12px;color:var(--muted);}
  .order-start b{color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif;}

  /* 拔除按鈕後，這列成為卡片最底端，移除 padding 與 border */
  .order-status-row{
    display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  }
  .order-timer{
    font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif;font-variant-numeric:tabular-nums;font-size:20px;font-weight:600;
    letter-spacing:0.5px;flex-shrink:0;
  }
  .order-fee{font-size:11px;color:var(--muted);text-align:right;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif;font-variant-numeric:tabular-nums;}
  .order-fee.over{color:var(--amber);}

  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px;}
  .summary .card{
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:12px 10px;
  }
  .summary .card .label{font-size:11px;color:var(--muted);line-height:1.4;}
  .summary .card .value{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif;font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;margin-top:4px;}
  .empty{font-size:13px;color:var(--muted);text-align:center;padding:20px 0;}

  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;
    align-items:center;justify-content:center;z-index:9900;padding:20px;
  }
  .overlay.show{display:flex;}
  .settings-panel{
    width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);
    border-radius:16px;padding:20px;
  }
  .settings-panel h3{margin:0 0 6px;font-size:16px;}
  .settings-panel .hint{font-size:12px;color:var(--muted);margin:0 0 16px;line-height:1.6;}
  #deleteRowInfo{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif;font-variant-numeric:tabular-nums;}
  .settings-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .settings-row label{font-size:13px;color:var(--muted);}
  .settings-row input[type=number]{
    width:70px;background:transparent;border:none;outline:none;color:var(--text);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif;font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;text-align:right;
  }
  .settings-actions{display:flex;gap:10px;margin-top:6px;}
  .settings-actions button{
    flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .settings-actions .cancel{background:transparent;border:1px solid var(--border);color:var(--muted);}
  .settings-actions .confirm{background:var(--amber);border:none;color:var(--on-amber);}

  .clear-all{font-size:12px;color:var(--muted);background:none;border:none;text-decoration:underline;cursor:pointer;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif;}
  .history-actions{display:flex;align-items:center;justify-content:space-between;margin-top:14px;}
  .export-btn{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    font-size:13px;padding:9px 14px;border-radius:10px;cursor:pointer;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif;
  }
  .export-btn:active{transform:scale(0.97);}
  
  .export-table{width:100%;table-layout:fixed;border-collapse:collapse;margin-top:14px;font-size:11px;}
  .export-table th,.export-table td{
    padding:6px 2px;text-align:center;border-bottom:1px solid var(--border);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif;font-variant-numeric:tabular-nums;white-space:normal;word-break:break-word;overflow-wrap:break-word;
  }
  .export-table th{color:var(--muted);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif;font-weight:600;font-size:10px;text-align:center;}
  .export-table th.sortable{cursor:pointer;user-select:none;transition:color 0.2s;}
  .export-table th.sortable:hover{color:var(--text);}
  
  .export-table tbody tr:last-child td{border-bottom:none;}
  .row-id-cell{-webkit-user-select:none;user-select:none;cursor:pointer;}
  .export-table tfoot td{border-top:1px solid var(--border);border-bottom:none;color:var(--amber);font-weight:600;padding-top:10px;}
  .export-table-scroll{overflow-x:hidden;}
  
  .detail-edit-input{
    width:100%;background:transparent;border:none;border-bottom:1px solid transparent;
    color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif;font-variant-numeric:tabular-nums;font-size:inherit;
    text-align:center;padding:0;min-width:0;box-sizing:border-box;
  }
  .detail-edit-input:focus{outline:none;border-bottom:1px solid var(--amber);}
  
  .base-edit-input{-moz-appearance:textfield;appearance:textfield;}
  .base-edit-input::-webkit-outer-spin-button,.base-edit-input::-webkit-inner-spin-button{
    -webkit-appearance:none;margin:0;
  }
  .ordno-edit-input{font-weight:600;}

  .export-empty{font-size:13px;color:var(--muted);text-align:center;padding:16px 0;}

  .tabs{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--border);margin-bottom:18px;}
  .tab-group{display:flex;gap:22px;}
  .brand-label{font-family:'Poppins',sans-serif;font-size:24px;font-weight:500;padding-bottom:5px;letter-spacing:0.2px;}
  .brand-uber{color:var(--brand-uber-color);}
  .brand-eats{color:var(--green);}
  .tab-btn{
    background:none;border:none;border-bottom:2px solid transparent;
    padding:9px 2px;color:var(--muted);font-weight:600;font-size:15px;
    cursor:pointer;font-family:inherit;
  }
  .tab-btn.active{color:var(--amber);border-bottom-color:var(--amber);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .theme-option-row{display:flex;gap:12px;flex-wrap:wrap;}
  .theme-option{
    flex:1;min-width:100px;display:flex;flex-direction:column;align-items:center;gap:10px;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:16px 10px;cursor:pointer;font-family:inherit;
  }
  .theme-option.active{border:2px solid var(--amber);}
  .theme-swatch{
    width:100%;height:48px;border-radius:8px;border:1px solid var(--border);
    display:block;
  }
  .theme-swatch-dark{background:#1B1F24;}
  .theme-swatch-light{background:#FFFFFF;}
  .theme-swatch-cyberpunk{background:linear-gradient(135deg,#FF2A6D 0%,#0A0E17 55%,#05D9E8 100%);}
  .theme-option-label{font-size:13px;color:var(--text);font-weight:600;text-align:center;line-height:1.5;}
  .theme-option-sub{font-size:11px;color:var(--muted);font-weight:400;}

  /* 雙模虛擬鍵盤專屬 CSS */
  .vk-container {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10000;
    background: var(--panel); border-top: 1px solid var(--border);
    padding: 14px 10px 24px; box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
    transform: translateY(100%); transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
    user-select: none; -webkit-user-select: none; display: flex; flex-direction: column;
  }
  .vk-container.show { transform: translateY(0); }
  .vk-layout { display: flex; flex-direction: column; width: 100%; max-width: 480px; margin: 0 auto; }
  .vk-row { display: flex; justify-content: center; gap: 6px; margin-bottom: 8px; }
  .vk-row:last-child { margin-bottom: 0; }
  .vk-key {
    flex: 1; background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; font-size: 24px; font-weight: 600; padding: 14px 0;
    cursor: pointer; font-family: system-ui, sans-serif; text-align: center;
    touch-action: manipulation; display: flex; align-items: center; justify-content: center;
  }
  .vk-key:active { background: var(--border); transform: scale(0.94); }
  .vk-key.action { font-size: 18px; }
  .vk-key.enter-key { background: var(--amber); color: var(--on-amber); border: none; }
  
  #vkQwerty .vk-key { font-size: 19px; padding: 12px 0; border-radius: 6px; }
  #vkQwerty .vk-row { gap: 4px; margin-bottom: 6px; }
  #vkQwerty .vk-key.action { font-size: 16px; }
</style>
</head>
<body>
<div class="app">
  <div class="tabs">
    <div class="tab-group">
      <button class="tab-btn active" data-tab="main">主頁</button>
      <button class="tab-btn" data-tab="detail">明細</button>
      <button class="tab-btn" data-tab="trash">垃圾桶</button>
      <button class="tab-btn" data-tab="settings">設定</button>
    </div>
    <span class="brand-label"><span class="brand-uber">Uber</span> <span class="brand-eats">Eats</span></span>
  </div>

  <div id="tabMain" class="tab-panel active">
    <div class="new-order-row">
      <button class="new-order-btn" id="newOrderBtn">＋ 新增一單</button>
      <button class="linked-btn" id="newLinkedBtn">＋ 新增疊單</button>
    </div>

    <div class="active-header">
      <h2>進行中的訂單</h2>
      <span class="count" id="activeCount">0 單</span>
    </div>
    <div id="activeList"><div class="empty">目前沒有進行中的訂單</div></div>

    <div class="summary">
      <div class="card">
        <div class="label">今日趟數</div>
        <div class="value" id="todayCount">0</div>
      </div>
      <div class="card">
        <div class="label">淨收入</div>
        <div class="value" id="todayBaseSum">NT$0</div>
      </div>
      <div class="card">
        <div class="label">差額費</div>
        <div class="value" id="todayFeeSum">NT$0</div>
      </div>
    </div>
  </div>

  <div id="tabDetail" class="tab-panel">
    <div class="settings-row" style="flex-wrap:wrap;margin-bottom:12px;">
      <label>範圍</label>
      <select id="exportRange" style="background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:8px;font-family:inherit;font-size:14px;">
        <option value="today">今天</option>
        <option value="all">全部歷史</option>
        <option value="custom">自訂日期範圍</option>
      </select>
    </div>
    <div class="settings-row" id="customDateRow" style="display:none;margin-bottom:12px;">
      <input type="date" id="rangeStart" style="background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:7px;font-family:inherit;">
      <span style="color:var(--muted);">至</span>
      <input type="date" id="rangeEnd" style="background:var(--panel-2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:7px;font-family:inherit;">
    </div>
    <div id="exportPreviewWrap"></div>
    <div class="history-actions">
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="export-btn" id="exportCsvBtn">匯出 CSV</button>
        <button class="export-btn" id="importCsvBtn">匯入 CSV</button>
        <input type="file" id="importCsvInput" accept=".csv" style="display:none;">
      </div>
      <button class="clear-all" id="clearAllBtn" style="display:none;">清空所有紀錄</button>
    </div>
    <p id="importStatus" style="font-size:12px;color:var(--muted);margin-top:8px;"></p>
  </div>

  <div id="tabTrash" class="tab-panel">
    <div class="active-header">
      <h2>垃圾桶</h2>
    </div>
    <div id="trashList"><div class="empty">垃圾桶是空的</div></div>
    <div class="history-actions" style="justify-content:flex-end;">
      <button class="clear-all" id="clearTrashBtn" style="display:none;">清空垃圾桶</button>
    </div>
  </div>

  <div id="tabSettings" class="tab-panel">
    <div class="active-header">
      <h2>主題色</h2>
    </div>
    <div class="theme-option-row">
      <button class="theme-option" data-theme-choice="light">
        <span class="theme-swatch theme-swatch-light"></span>
        <span class="theme-option-label">白色主題<br><span class="theme-option-sub">預設</span></span>
      </button>
      <button class="theme-option" data-theme-choice="dark">
        <span class="theme-swatch theme-swatch-dark"></span>
        <span class="theme-option-label">深色主題</span>
      </button>
      <button class="theme-option" data-theme-choice="cyberpunk">
        <span class="theme-swatch theme-swatch-cyberpunk"></span>
        <span class="theme-option-label">賽博龐克</span>
      </button>
    </div>
  </div>
</div>

<div class="overlay" id="confirmClearOverlay">
  <div class="settings-panel" style="max-width:340px;text-align:center;">
    <h3 style="margin-bottom:10px;">清空所有紀錄？</h3>
    <p class="hint" style="margin-bottom:18px;">這會刪除全部歷史紀錄，且無法復原。建議先用「匯出 CSV」備份。</p>
    <div class="settings-actions">
      <button class="cancel" id="confirmClearCancel">取消</button>
      <button class="confirm" id="confirmClearOk" style="background:var(--red);color:var(--on-red);">確定清空</button>
    </div>
  </div>
</div>

<div class="overlay" id="confirmClearTrashOverlay">
  <div class="settings-panel" style="max-width:340px;text-align:center;">
    <h3 style="margin-bottom:10px;">清空垃圾桶？</h3>

<script>
const KEY_ACTIVE = 'meter_active';
const KEY_ORDERS = 'meter_orders';
const KEY_TRASH = 'meter_trash';

let active = [];
let orders = [];
let trashItems = [];

// 明細表排序變數
let sortCol = null;
let sortAsc = true;

const $ = id => document.getElementById(id);

function loadJSON(key, fallback){
  try{
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  }catch(e){ return fallback; }
}
function saveJSON(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
}
function genId(){
  return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,7);
}

function fmtHHMM(ts){
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function parseTimeInput(str){
  str = (str || '').trim();
  if(!str) return null;
  let h, m;
  if(str.includes(':')){
    const parts = str.split(':');
    if(parts.length !== 2) return null;
    h = parseInt(parts[0], 10);
    m = parseInt(parts[1], 10);
  }else{
    const digits = str.replace(/\D/g, '');
    if(digits.length === 3){
      h = parseInt(digits.slice(0,1), 10);
      m = parseInt(digits.slice(1), 10);
    }else if(digits.length === 4){
      h = parseInt(digits.slice(0,2), 10);
      m = parseInt(digits.slice(2), 10);
    }else{
      return null;
    }
  }
  if(isNaN(h) || isNaN(m) || h < 0 || h > 23 || m < 0 || m > 59) return null;
  return { h, m };
}
function fmtMMSS(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(totalSec/60);
  const s = totalSec%60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function money(n){
  const r = Math.round(n*10)/10;
  return 'NT$' + (Number.isInteger(r) ? r : r.toFixed(1));
}
function plainNum(n){
  const r = Math.round(n*10)/10;
  return Number.isInteger(r) ? String(r) : r.toFixed(1);
}

/* ================== 新版專法核心計算邏輯 ================== */
function getBilledMinutes(startTs, endTs) {
  const totalSec = Math.max(0, Math.floor((endTs - startTs) / 1000));
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return s >= 30 ? m + 1 : m;
}

function getLegalMinPrice(mins) {
  const val = mins * (245 / 60);
  const rounded = Math.ceil(val * 10) / 10;
  return Math.max(45, rounded);
}

function getCoveredMin(basePrice, isLinked) {
  const bp = basePrice || 0;
  let m = 0;
  while(m <= 120) {
    let leg = getLegalMinPrice(m + 1);
    if (isLinked) leg *= 2;
    if (leg > bp) break;
    m++;
  }
  return m;
}

function calcOrderSubsidy(o, endTs) {
  const billedMin = getBilledMinutes(o.startTs, endTs);
  const legalMin = getLegalMinPrice(billedMin);
  
  const isLinked = !!o.linkGroupId;
  const bp = o.basePrice || 0;
  
  const covered = getCoveredMin(bp, isLinked);
  const actualExtraMin = Math.max(0, billedMin - covered);

  if (isLinked) {
    if (o.linkRole === 'secondary') {
      return { billedMin, extraMin: 0, legalTotal: legalMin, extraFee: 0 };
    }
    const totalLegal = legalMin * 2;
    const extraFee = Math.max(0, totalLegal - bp);
    return { billedMin, extraMin: actualExtraMin, legalTotal: totalLegal, extraFee: Math.round(extraFee * 10) / 10 };
  }

  const extraFee = Math.max(0, legalMin - bp);
  return { billedMin, extraMin: actualExtraMin, legalTotal: legalMin, extraFee: Math.round(extraFee * 10) / 10 };
}

function getExactTimes(o) {
  const ms = Math.max(0, o.endTs - o.startTs);
  const elapsed = fmtMMSS(ms);
  
  if (o.excludeBaseFromTotal) return { elapsed, over: '-' };

  let thresholdMin = 0;
  while (thresholdMin <= 120) {
    let legal = getLegalMinPrice(thresholdMin);
    if (o.linkGroupId) legal *= 2; 
    if (legal > (o.basePrice || 0)) break;
    thresholdMin++;
  }
  let targetSec = thresholdMin * 60 - 30;
  if (thresholdMin === 0) targetSec = 0;
  
  const targetTs = o.startTs + targetSec * 1000;
  const overMs = Math.max(0, o.endTs - targetTs);
  
  const over = overMs > 0 ? fmtMMSS(overMs) : '-';
  return { elapsed, over };
}

function getFeeStatus(o, now) {
  if(!o.basePrice || o.basePrice <= 0){
    return { text: '請先輸入單價', over: false };
  }
  if(o.linkRole === 'secondary'){
    return { text: '差額併入 A 單', over: false };
  }

  const { extraFee } = calcOrderSubsidy(o, now);

  let thresholdMin = 0;
  while (thresholdMin <= 120) {
    let legal = getLegalMinPrice(thresholdMin);
    if (o.linkGroupId) legal *= 2; 
    if (legal > (o.basePrice || 0)) break;
    thresholdMin++;
  }

  let targetSec = thresholdMin * 60 - 30;
  if (thresholdMin === 0) targetSec = 0;
  const targetTs = o.startTs + targetSec * 1000;

  if(extraFee > 0){
    const elapsedOverMs = now - targetTs;
    const overTimeStr = fmtMMSS(Math.max(0, elapsedOverMs));
    return { text: `已超時 <span style="font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,monospace;font-variant-numeric:tabular-nums;">${overTimeStr}</span>，+${money(extraFee)}`, over: true };
  }

  if (targetTs > now) {
    const remainStr = fmtMMSS(targetTs - now);
    return { text: `還有 <span style="font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,monospace;font-variant-numeric:tabular-nums;">${remainStr}</span> 開始補差額`, over: false };
  }

  return { text: '尚未達標', over: false };
}
/* ======================================================= */

function init(){
  active = loadJSON(KEY_ACTIVE, []);
  orders = loadJSON(KEY_ORDERS, []);
  trashItems = loadJSON(KEY_TRASH, []);
  let migrated = false;
  orders.forEach(o=>{
    if(o.extraFee !== undefined){
      const rounded = Math.round(o.extraFee * 10) / 10;
      if(rounded !== o.extraFee){
        o.extraFee = rounded;
        o.total = (o.excludeBaseFromTotal ? 0 : (o.basePrice || 0)) + rounded;
        migrated = true;
      }
    }
  });
  if(migrated) saveJSON(KEY_ORDERS, orders);
  applyTheme(loadJSON(KEY_THEME, 'light'));
  renderActive();
  computeTodaySummary();
  renderDetailTable();
  renderTrash();
  setInterval(tick, 1000);
}

/* ================== 雙模虛擬鍵盤引擎 ================== */
let activeVkInput = null;
let activeVkWrapper = null;
let vkHistoryStateAdded = false;

function openVk(inputEl, layout) {
  if (activeVkInput && activeVkInput !== inputEl) {
    activeVkInput.blur();
  }
  if (activeVkWrapper) {
    activeVkWrapper.classList.remove('vk-active');
  }
  
  activeVkInput = inputEl;
  activeVkInput.focus();
  
  activeVkWrapper = inputEl.classList.contains('price-input') ? inputEl.closest('.price-input-wrap') : inputEl;
  activeVkWrapper.classList.add('vk-active');
  
  $('vkNumpad').style.display = layout === 'numpad' ? 'flex' : 'none';
  $('vkQwerty').style.display = layout === 'qwerty' ? 'flex' : 'none';
  
  if (!vkHistoryStateAdded) {
    history.pushState({vk: true}, '');
    vkHistoryStateAdded = true;
  }

  const vkContainer = $('vkContainer');
  const vkHeight = vkContainer.offsetHeight || (layout === 'qwerty' ? 260 : 220);
  document.body.style.paddingBottom = (vkHeight + 40) + 'px';

  requestAnimationFrame(() => {
    vkContainer.classList.add('show');
    setTimeout(() => {
      const cardWrap = inputEl.closest('.swipe-card-wrap');
      if (cardWrap) {
        const actualVkHeight = vkContainer.offsetHeight; 
        const rect = cardWrap.getBoundingClientRect();
        const safeBottom = window.innerHeight - actualVkHeight - 10;
        
        if (rect.bottom > safeBottom) {
          window.scrollBy({ top: rect.bottom - safeBottom, behavior: 'smooth' });
        } else if (rect.top < 60) {
          window.scrollBy({ top: rect.top - 60, behavior: 'smooth' });
        }
      }
    }, 180);
  });
}

function closeVk(fromPopState = false) {
  if (activeVkInput) activeVkInput.blur(); 
  if (activeVkWrapper) activeVkWrapper.classList.remove('vk-active'); 
  
  activeVkInput = null;
  activeVkWrapper = null;
  
  $('vkContainer').classList.remove('show');
  document.body.style.paddingBottom = '';

  if (vkHistoryStateAdded && !fromPopState) {
    vkHistoryStateAdded = false;
    history.back();
  } else {
    vkHistoryStateAdded = false;
  }
}

function handleVkKey(key) {
  if (!activeVkInput) return;
  
  if (key === 'ENTER' || key === 'CANCEL') {
    closeVk();
    return;
  }
  
  let val = activeVkInput.value;
  let start = activeVkInput.selectionStart || 0;
  let end = activeVkInput.selectionEnd || 0;
  
  if (key === 'BACKSPACE') {
    if (start === end && start > 0) {
      val = val.slice(0, start - 1) + val.slice(end);
      activeVkInput.value = val;
      activeVkInput.setSelectionRange(start - 1, start - 1);
    } else if (start !== end) {
      val = val.slice(0, start) + val.slice(end);
      activeVkInput.value = val;
      activeVkInput.setSelectionRange(start, start);
    }
  } else {
    if (start === end) {
      if (activeVkInput.classList.contains('ordno-input') && val.length >= 10) return;
      if (activeVkInput.classList.contains('price-input') && val.length >= 6) return;
    }
    val = val.slice(0, start) + key + val.slice(end);
    activeVkInput.value = val;
    activeVkInput.setSelectionRange(start + key.length, start + key.length);
  }
  
  activeVkInput.dispatchEvent(new Event('input', { bubbles: true }));
}

$('vkContainer').addEventListener('pointerdown', e => {
  e.preventDefault();
  const btn = e.target.closest('.vk-key');
  if (btn) {
    const key = btn.getAttribute('data-key') || btn.textContent.trim();
    handleVkKey(key);
  }
});

let vkPointerDownX = 0;
let vkPointerDownY = 0;
window.swipeDragging = false; // 全域防呆：判定目前是否正在滑動卡片

document.addEventListener('pointerdown', (e) => {
  vkPointerDownX = e.clientX;
  vkPointerDownY = e.clientY;
});

document.addEventListener('pointerup', (e) => {
  if (!$('vkContainer').classList.contains('show')) return;
  if (e.target.closest('#vkContainer')) return; 

  const dx = Math.abs(e.clientX - vkPointerDownX);
  const dy = Math.abs(e.clientY - vkPointerDownY);

  if (dx > 10 || dy > 10) return;
  if (e.target.closest('input')) return;

  closeVk();
});

window.addEventListener('popstate', (e) => {
  if (vkHistoryStateAdded) {
    vkHistoryStateAdded = false;
    closeVk(true); 
  }
});

document.addEventListener('keydown', e => {
  if (!$('vkContainer').classList.contains('show') || !activeVkInput) return;
  const key = e.key.toUpperCase();
  
  if (key === 'ENTER') { e.preventDefault(); handleVkKey('ENTER'); }
  else if (key === 'BACKSPACE') { e.preventDefault(); handleVkKey('BACKSPACE'); }
  else if (key === 'ESCAPE') { e.preventDefault(); handleVkKey('CANCEL'); }
  else if (/^[A-Z0-9]$/.test(key)) {
    e.preventDefault();
    handleVkKey(key);
  }
});
/* ======================================================= */

let pendingNewIds = [];

$('newOrderBtn').addEventListener('click', ()=>{
  const id = genId();
  active.push({ id, basePrice: 0, startTs: Date.now() });
  saveJSON(KEY_ACTIVE, active);
  pendingNewIds = [id];
  renderActive();
  
  setTimeout(()=>{
    const newInput = document.querySelector(`input.price-input[data-base="${id}"]`);
    if(newInput) openVk(newInput, 'numpad');
  }, 50);
});

$('newLinkedBtn').addEventListener('click', ()=>{
  const groupId = genId();
  const now = Date.now();
  const idA = genId();
  const idB = genId();
  active.push({ id: idA, basePrice: 0, startTs: now, linkGroupId: groupId, linkRole: 'primary' });
  active.push({ id: idB, basePrice: 0, startTs: now, linkGroupId: groupId, linkRole: 'secondary' });
  saveJSON(KEY_ACTIVE, active);
  pendingNewIds = [idA, idB];
  renderActive();
  
  setTimeout(()=>{
    const newInputA = document.querySelector(`input.price-input[data-base="${idA}"]`);
    if(newInputA) openVk(newInputA, 'numpad');
  }, 50);
});

function renderActive(){
  const list = $('activeList');
  $('activeCount').textContent = active.length + ' 單';

  const prevRects = {};
  list.querySelectorAll('.swipe-card-wrap').forEach(el=>{
    prevRects[el.getAttribute('data-swipe-card')] = el.getBoundingClientRect();
  });

  if(active.length === 0){
    list.innerHTML = '<div class="empty">目前沒有進行中的訂單</div>';
    return;
  }
  const sorted = [...active].sort((a,b)=>b.startTs-a.startTs);
  const now0 = Date.now();
  list.innerHTML = sorted.map(o => {
    const isPrimary = o.linkRole === 'primary';
    const isSecondary = o.linkRole === 'secondary';
    const badge = isPrimary ? '<span class="link-badge">疊單 A</span>' : isSecondary ? '<span class="link-badge">疊單 B</span>' : '';
    
    const priceField = isSecondary
      ? `<div class="price-input-wrap locked-price"><span>NT$</span><input type="text" class="price-input" value="-" readonly tabindex="-1"></div>`
      : `<div class="price-input-wrap"><span>NT$</span><input type="text" class="price-input" data-base="${o.id}" value="${o.basePrice || ''}" placeholder="單價" inputmode="none"></div>`;
    
    const feeStatus = getFeeStatus(o, now0);
    return `
    <div class="swipe-card-wrap" data-swipe-card="${o.id}">
      <div class="order-card" data-order-id="${o.id}">
        <div class="ordno-price-row">
          <input type="text" class="ordno-input" data-ordno="${o.id}" value="${o.orderNo ? o.orderNo.replace(/"/g,'&quot;') : ''}" placeholder="單號" inputmode="none">
          ${priceField}
        </div>
        <div class="order-head">
          <span class="order-start">開始 <b>${fmtHHMM(o.startTs)}</b>${badge}</span>
        </div>
        <div class="order-status-row">
          <span class="order-timer" data-timer="${o.id}">00:00</span>
          <span class="order-fee${feeStatus.over ? ' over' : ''}" data-fee="${o.id}">${feeStatus.text}</span>
        </div>
      </div>
    </div>
  `;
  }).join('');

  // 初始化雙向手勢引擎
  initCardSwipe();

  const wraps = Array.from(list.querySelectorAll('.swipe-card-wrap'));
  const animating = [];
  wraps.forEach((el, idx)=>{
    const id = el.getAttribute('data-swipe-card');
    const prev = prevRects[id];
    el.style.zIndex = String(wraps.length - idx);
    if(!prev) return;
    const next = el.getBoundingClientRect();
    const dy = prev.top - next.top;
    if(Math.abs(dy) < 1) return;
    animating.push({ el, dy });
  });
  animating.forEach(({el, dy})=>{
    el.style.transition = 'none';
    el.style.transform = `translateY(${dy}px)`;
  });
  if(animating.length){
    void list.offsetHeight;
    requestAnimationFrame(()=>{
      animating.forEach(({el})=>{
        el.style.transition = 'transform 0.15s ease';
        el.style.transform = 'translateY(0)';
      });
      setTimeout(()=>{
        animating.forEach(({el})=>{
          el.style.transition = '';
          el.style.transform = '';
          el.style.zIndex = '';
        });
      }, 170);
    });
  }

  if(pendingNewIds.length){
    const newEls = pendingNewIds
      .map(id => list.querySelector(`.swipe-card-wrap[data-swipe-card="${id}"]`))
      .filter(Boolean);
    const pushDelay = animating.length ? 70 : 0;
    newEls.forEach(el=>{
      el.style.transition = 'none';
      el.style.transform = 'scale(0.92)';
      el.style.opacity = '0';
    });
    if(newEls.length){
      void list.offsetHeight;
      setTimeout(()=>{
        newEls.forEach(el=>{
          el.style.transition = 'transform 0.15s ease, opacity 0.15s ease';
          el.style.transform = 'scale(1)';
          el.style.opacity = '1';
        });
        setTimeout(()=>{
          newEls.forEach(el=>{
            el.style.transition = '';
            el.style.transform = '';
            el.style.opacity = '';
          });
        }, 170);
      }, pushDelay);
    }
    pendingNewIds = [];
  }
}

$('activeList').addEventListener('input', e=>{
  const baseId = e.target.getAttribute('data-base');
  const ordId = e.target.getAttribute('data-ordno');
  if(baseId){
    const o = active.find(a=>a.id===baseId);
    if(o){
      o.basePrice = parseFloat(e.target.value) || 0;
      if(o.linkRole === 'primary' && o.linkGroupId){
        active.filter(a => a.linkGroupId === o.linkGroupId && a.linkRole === 'secondary').forEach(sec=>{
          sec.basePrice = o.basePrice;
          updateFeeDisplay(sec);
        });
      }
      saveJSON(KEY_ACTIVE, active);
      updateFeeDisplay(o);
    }
  }
  if(ordId){
    const o = active.find(a=>a.id===ordId);
    if(o){
      const upper = e.target.value.toUpperCase();
      o.orderNo = upper;
      if(e.target.value !== upper){
        const cursorPos = e.target.selectionStart;
        e.target.value = upper;
        e.target.setSelectionRange(cursorPos, cursorPos);
      }
      saveJSON(KEY_ACTIVE, active);
    }
  }
});

// 使用 click 來攔截虛擬鍵盤彈出，若判定在「滑動中 (swipeDragging)」，則阻擋！
$('activeList').addEventListener('click', e=>{
  if(window.swipeDragging) return; // 終極防呆：滑動中絕對不彈鍵盤
  
  const ordInput = e.target.closest('.ordno-input');
  if (ordInput) {
    openVk(ordInput, 'qwerty');
    return;
  }
  
  const priceInput = e.target.closest('.price-input');
  if (priceInput && !priceInput.classList.contains('locked-price')) {
    openVk(priceInput, 'qwerty'); // 統一高度：手動點擊皆為英數 QWERTY
    return;
  }
});

// ==========================================
// 全新引擎：純色底層，雙向手勢 (右滑完成 / 左滑刪除)
// ==========================================
function initCardSwipe(){
  document.querySelectorAll('.swipe-card-wrap').forEach(wrap=>{
    const id = wrap.getAttribute('data-swipe-card');
    const card = wrap.querySelector('.order-card');
    let dragging = false;
    let decided = false;
    let cancelled = false;
    let startX = 0, startY = 0;
    let currentX = 0;

    function onPointerDown(e){
      // 容許從任何地方起滑！就算點在輸入框上也能滑動卡片！
      dragging = true;
      decided = false;
      cancelled = false;
      currentX = 0;
      startX = e.clientX;
      startY = e.clientY;
      card.style.transition = 'none';
      wrap.style.backgroundColor = 'transparent'; // 重置底色
    }
    function onPointerMove(e){
      if(!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      
      if(!decided){
        if(Math.abs(dx) < 10 && Math.abs(dy) < 10) return; // 容錯判定
        decided = true;
        if(Math.abs(dy) > Math.abs(dx)){
          cancelled = true;
          dragging = false;
          return;
        }
        
        // 判定為水平滑動！奪取控制權
        card.setPointerCapture(e.pointerId);
        window.swipeDragging = true;
        
        // 瞬間抹殺游標與鍵盤！
        if (document.activeElement && card.contains(document.activeElement)) {
           document.activeElement.blur();
        }
        closeVk();
      }
      
      if(cancelled) return;
      currentX = dx; 
      card.style.transform = `translateX(${currentX}px)`;
      
      // 動態漸變純淨底色：右滑變綠，左滑變紅
      if (currentX > 0) {
        wrap.style.backgroundColor = 'var(--green)';
      } else if (currentX < 0) {
        wrap.style.backgroundColor = 'var(--red)';
      }
    }
    
    function onPointerUp(e){
      if(!dragging) return;
      dragging = false;
      if(cancelled) return;
      
      const maxDist = wrap.clientWidth * 0.25; // 觸發閾值：25% 卡片寬度
      card.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
      
      if(currentX >= maxDist){
        // 往右超過閾值：完成訂單 (飛出右邊界)
        card.style.transform = `translateX(${wrap.clientWidth}px)`;
        card.style.opacity = '0';
        setTimeout(()=> completeOrder(id), 180);
      } else if(currentX <= -maxDist){
        // 往左超過閾值：刪除訂單 (飛出左邊界)
        card.style.transform = `translateX(-${wrap.clientWidth}px)`;
        card.style.opacity = '0';
        setTimeout(()=> cancelOrder(id), 180);
      } else {
        // 未達閾值：Ｑ彈回歸原位
        card.style.transform = 'translateX(0)';
        wrap.style.backgroundColor = 'transparent';
      }
      
      currentX = 0;
      setTimeout(()=>{ window.swipeDragging = false; }, 50); // 延遲解除防呆
    }
    
    wrap.addEventListener('pointerdown', onPointerDown);
    wrap.addEventListener('pointermove', onPointerMove);
    wrap.addEventListener('pointerup', onPointerUp);
    wrap.addEventListener('pointercancel', onPointerUp);
  });
}

function completeOrder(id){
  const idx = active.findIndex(a=>a.id===id);
  if(idx === -1) return;
  const o = active[idx];
  const endTs = Date.now();

  let toComplete = [o];
  if (o.linkGroupId) {
    toComplete = active.filter(a => a.linkGroupId === o.linkGroupId);
  }

  toComplete.forEach(item => {
    const { billedMin, extraMin, extraFee } = calcOrderSubsidy(item, endTs);
    const isSec = item.linkRole === 'secondary';
    
    const record = {
      id: genId(),
      orderNo: item.orderNo || '',
      basePrice: item.basePrice || 0,
      excludeBaseFromTotal: isSec,
      startTs: item.startTs,
      endTs,
      elapsedMinCeil: billedMin,
      extraMin: extraMin,
      extraFee: extraFee,
      total: (isSec ? 0 : (item.basePrice || 0)) + extraFee,
      linkGroupId: item.linkGroupId,
      linkRole: item.linkRole
    };
    
    orders.unshift(record);
    const rIdx = active.findIndex(a => a.id === item.id);
    if(rIdx > -1) active.splice(rIdx,1);
  });

  saveJSON(KEY_ACTIVE, active);
  saveJSON(KEY_ORDERS, orders);
  
  closeVk();
  renderActive();
  computeTodaySummary();
  renderDetailTable();
}

function cancelOrder(id){
  const idx = active.findIndex(a=>a.id===id);
  if(idx === -1) return;
  const item = active[idx];
  item.deletedAt = Date.now();
  trashItems.unshift(item);
  active.splice(idx,1);
  saveJSON(KEY_ACTIVE, active);
  saveJSON(KEY_TRASH, trashItems);
  
  closeVk();
  renderActive();
  renderTrash();
}

function dayStart(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return d.getTime();
}
function getExportOrders(){
  const range = $('exportRange').value;
  const chronological = [...orders].reverse();
  if(range === 'today'){
    const today = new Date().toDateString();
    return chronological.filter(o => new Date(o.startTs).toDateString() === today);
  }
  if(range === 'custom'){
    const startVal = $('rangeStart').value;
    const endVal = $('rangeEnd').value;
    if(!startVal || !endVal) return [];
    const startMs = dayStart(startVal);
    const endMs = dayStart(endVal) + 24*60*60*1000;
    return chronological.filter(o => o.startTs >= startMs && o.startTs < endMs);
  }
  return chronological;
}
function fmtDateOnly(ts){
  const d = new Date(ts);
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${mm}/${dd}`;
}
function fmtDateFull(ts){
  const d = new Date(ts);
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yyyy}/${mm}/${dd}`;
}

  const baseSum = list.reduce((s,o)=> s + (o.excludeBaseFromTotal ? 0 : o.basePrice), 0);
  const feeSum = list.reduce((s,o)=>s+o.extraFee,0);
  
  let displayList = list.map((o, i) => {
    return { _obj: o, origIndex: i + 1, elapsedMs: o.endTs - o.startTs };
  });

  if (sortCol) {
    displayList.sort((a, b) => {
      let valA, valB;
      if (sortCol === 'id') { valA = a.origIndex; valB = b.origIndex; }
      else if (sortCol === 'elapsed') { valA = a.elapsedMs; valB = b.elapsedMs; }
      else if (sortCol === 'overtime') { valA = a._obj.extraMin; valB = b._obj.extraMin; }
      else if (sortCol === 'base') { valA = a._obj.excludeBaseFromTotal ? -1 : (a._obj.basePrice || 0); valB = b._obj.excludeBaseFromTotal ? -1 : (b._obj.basePrice || 0); }
      else if (sortCol === 'fee') { valA = a._obj.excludeBaseFromTotal ? -1 : (a._obj.extraFee || 0); valB = b._obj.excludeBaseFromTotal ? -1 : (b._obj.extraFee || 0); }

      if (valA < valB) return sortAsc ? -1 : 1;
      if (valA > valB) return sortAsc ? 1 : -1;
      return 0;
    });
  }
  
  wrap.innerHTML = `
    <div class="export-table-scroll">

        <tbody>

            const o = item._obj;

              <td>${fmtDateOnly(o.startTs)}</td>
              <td><input type="text" inputmode="numeric" maxlength="5" class="detail-edit-input time-edit-input" data-edit-start="${o.id}" value="${fmtHHMM(o.startTs)}" placeholder="HH:MM"></td>
              <td><input type="text" inputmode="numeric" maxlength="5" class="detail-edit-input time-edit-input" data-edit-end="${o.id}" value="${fmtHHMM(o.endTs)}" placeholder="HH:MM"></td>
              <td>${t.elapsed}</td>
              <td>${t.over}</td>
              <td>${o.excludeBaseFromTotal ? '-' : `<input type="number" class="detail-edit-input base-edit-input" data-edit-base="${o.id}" value="${o.basePrice}" min="0">`}</td>
              <td>${displayFee}</td>

        </tbody>

$('exportPreviewWrap').addEventListener('change', e=>{
  const baseId = e.target.getAttribute('data-edit-base');
  const ordnoId = e.target.getAttribute('data-edit-ordno');
  const startId = e.target.getAttribute('data-edit-start');
  const endId = e.target.getAttribute('data-edit-end');

  if(baseId){

    if(order){
      const newVal = parseFloat(e.target.value) || 0;
      order.basePrice = newVal;
      const { extraMin, extraFee } = calcOrderSubsidy(order, order.endTs);
      order.extraMin = extraMin;
      order.extraFee = extraFee;
      order.total = newVal + order.extraFee;

      computeTodaySummary();
      renderDetailTable();
    }
    return;
  }

  if(ordnoId){
    const order = orders.find(o => o.id === ordnoId);
    if(order){
      order.orderNo = e.target.value.toUpperCase();
      saveJSON(KEY_ORDERS, orders);
      renderDetailTable();
    }
    return;
  }

  if(startId || endId){
    const id = startId || endId;
    const order = orders.find(o => o.id === id);
    if(!order) return;
    const parsed = parseTimeInput(e.target.value);
    if(!parsed){
      const err = $('editTimeError');
      err.textContent = '時間格式看不懂，請輸入像 14:30 或 1430 這樣的格式，已還原修改';
      err.style.display = 'block';
      setTimeout(()=>{ err.style.display = 'none'; }, 3000);
      renderDetailTable();
      return;
    }
    const { h, m } = parsed;

    let newStartTs = order.startTs;
    let newEndTs = order.endTs;
    if(startId){
      const d = new Date(order.startTs);
      d.setHours(h, m, 0, 0);
      newStartTs = d.getTime();
    }else{
      const d = new Date(order.endTs);
      d.setHours(h, m, 0, 0);
      newEndTs = d.getTime();
    }

    if(newEndTs <= newStartTs){
      const err = $('editTimeError');
      err.textContent = '完成時間必須晚於開始時間，已還原修改';
      err.style.display = 'block';
      setTimeout(()=>{ err.style.display = 'none'; }, 3000);
      renderDetailTable();
      return;
    }

    let group = [order];
    if (order.linkGroupId) {
      group = orders.filter(o => o.linkGroupId === order.linkGroupId);
    }
    
    group.forEach(go => {
      go.startTs = newStartTs;
      go.endTs = newEndTs;
      const { billedMin, extraMin, extraFee } = calcOrderSubsidy(go, newEndTs);
      go.elapsedMinCeil = billedMin;
      go.extraMin = extraMin;
      go.extraFee = extraFee;
      go.total = (go.linkRole === 'secondary' ? 0 : (go.basePrice || 0)) + extraFee;
    });

    saveJSON(KEY_ORDERS, orders);
    computeTodaySummary();
    renderDetailTable();
  }
});

function csvEscape(v){
  const s = String(v ?? '');
  return '"' + s.replace(/"/g,'""') + '"';
}
$('exportCsvBtn').addEventListener('click', ()=>{

  const header = ['編號','單號','日期','開始','結束','用時','超時','單價','差額','疊單共用'];
  const rows = list.map((o,i) => {
    const t = getExactTimes(o);
    const outElapsed = t.elapsed;
    const outOver = t.over === '-' ? '' : t.over;
    const outBase = o.excludeBaseFromTotal ? '' : o.basePrice;
    const outFee = o.excludeBaseFromTotal ? '' : (o.extraFee === 0 ? '' : o.extraFee);

    return [
      i+1, o.orderNo || '', fmtDateFull(o.startTs), fmtHHMM(o.startTs), fmtHHMM(o.endTs), outElapsed, outOver, outBase, outFee, o.excludeBaseFromTotal ? '是' : ''

  const totalRow = ['','總計','','','','','', baseSum.toFixed(1), feeSum.toFixed(1), ''];
  
  const csv = '\uFEFF' + [header, ...rows, totalRow].map(r => r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });

function showImportStatus(msg){

function parseCsvLine(line){
  const result = [];
  let cur = '';
  let inQuotes = false;
  for(let i = 0; i < line.length; i++){
    const ch = line[i];
    if(inQuotes){
      if(ch === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; }
        else { inQuotes = false; }
      }else{
        cur += ch;
      }
    }else{
      if(ch === '"'){ inQuotes = true; }
      else if(ch === ','){ result.push(cur); cur = ''; }
      else { cur += ch; }
    }
  }
  result.push(cur);
  return result;
}
function parseCsvText(text){
  const clean = text.replace(/^\uFEFF/, '');
  const lines = clean.split(/\r\n|\n/).filter(l => l.trim().length > 0);
  return lines.map(parseCsvLine);
}

      const dataRows = rows.slice(1);
      const currentYear = new Date().getFullYear();
      const imported = [];
      dataRows.forEach(r=>{
        if(r.length < 8) return;
        const orderNo = r[1];
        if(orderNo === '總計') return;
        const dateStr = r[2];
        const startStr = r[3];
        const endStr = r[4];
        
        const isNewFormat = (r.length >= 10 && (r[9] === '是' || r[9] === '' || r[8] === '是' || r[8] === '')); 
        let basePriceIdx = isNewFormat ? 7 : 6;
        let extraFeeIdx = isNewFormat ? 8 : 7;
        let excludeIdx = isNewFormat ? 9 : 8;
        
        const bpStr = r[basePriceIdx];
        const basePrice = (bpStr === '-' || !bpStr) ? 0 : parseFloat(bpStr) || 0;
        
        const excludeBaseFromTotal = r[excludeIdx] === '是' || r[excludeIdx] === '1' || r[excludeIdx] === 'Y';
        const dateParts = dateStr.split('/').map(n => parseInt(n));
        let yyyy, mm, dd;
        if(dateParts.length === 3){
          [yyyy, mm, dd] = dateParts;
        }else if(dateParts.length === 2){
          [mm, dd] = dateParts;
          yyyy = currentYear;
        }else{
          return;
        }
        if(!yyyy || !mm || !dd) return;
        const [sh, sm] = startStr.split(':').map(n => parseInt(n));
        const [eh, em] = endStr.split(':').map(n => parseInt(n));
        const startTs = new Date(yyyy, mm - 1, dd, sh || 0, sm || 0, 0).getTime();
        let endTs = new Date(yyyy, mm - 1, dd, eh || 0, em || 0, 0).getTime();
        if(endTs <= startTs) endTs += 24*60*60*1000;
        
        const billedMin = getBilledMinutes(startTs, endTs);
        
        const isLinked = !excludeBaseFromTotal ? false : true; 
        let covered = getCoveredMin(basePrice, isLinked);
        const actualExtraMin = excludeBaseFromTotal ? 0 : Math.max(0, billedMin - covered);
        
        const efStr = r[extraFeeIdx];
        const extraFee = (efStr === '-' || !efStr) ? 0 : parseFloat(efStr) || 0;
        
        imported.push({
          id: genId(),
          orderNo: orderNo || '',
          basePrice,
          excludeBaseFromTotal,
          startTs, endTs,
          elapsedMinCeil: billedMin, 
          extraMin: actualExtraMin, 
          extraFee,
          total: (excludeBaseFromTotal ? 0 : basePrice) + extraFee
        });
      });
      if(imported.length === 0){ showImportStatus('沒有讀到可匯入的紀錄，請確認CSV格式'); e.target.value=''; return; }
      orders = orders.concat(imported);
      orders.sort((a,b) => b.startTs - a.startTs);
      saveJSON(KEY_ORDERS, orders);
      computeTodaySummary();
      renderDetailTable();
      showImportStatus(`已匯入 ${imported.length} 筆紀錄`);
    }catch(err){
      showImportStatus('匯入失敗，請確認CSV格式是否正確');
    }
    e.target.value = '';
  };
  reader.readAsText(file, 'UTF-8');
});

init();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
