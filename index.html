<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" id="themeColorMeta" content="#FFFFFF">
<title>UE跑跑算</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1F24; --panel:#23282F; --panel-2:#2C333C; --text:#EDEFF2; --muted:#8A929C;
    --amber:#FFB020; --amber-dim:#4A3A18; --green:#3DDC97; --green-dim:#1C3A2E;
    --red:#FF5C5C; --border:#343B44; --brand-uber-color:#fff;
    --on-green:#0C2A1E; --on-amber:#412402; --on-red:#3A0F0F; --chart-blue:#3B82F6;
  }
  html[data-theme="light"]{
    --bg:#FFFFFF; --panel:#FFFFFF; --panel-2:#F1F2F4; --text:#1B1F24; --muted:#6B7280;
    --amber:#1B1F24; --amber-dim:#E1E3E6; --green:#3B814B; --green-dim:#E4F2E8;
    --red:#C23A3A; --border:#E1E3E6; --brand-uber-color:#1B1F24;
    --on-green:#fff; --on-amber:#fff; --on-red:#fff; --chart-blue:#3B82F6;
  }
  html[data-theme="cyberpunk"]{
    --bg:#0A0E17; --panel:#140B28; --panel-2:#1F0F35; --text:#E8F4FF; --muted:#9A8BC2;
    --amber:#FF2A6D; --amber-dim:#3D0A22; --green:#05D9E8; --green-dim:#062830;
    --red:#FF3C64; --border:#331E52; --brand-uber-color:#05D9E8;
    --on-green:#0A0E17; --on-amber:#0A0E17; --on-red:#0A0E17; --chart-blue:#05D9E8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  
  html,body{ margin:0;padding:0; overscroll-behavior-y:none; }
  body{
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif;
    min-height:100vh; display:flex; justify-content:center; overflow-x:hidden;
    transition: padding-bottom 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
  }
  .app{width:100%;max-width:480px;padding:0 16px 60px; display:flex; flex-direction:column;}

  /* 🚀 動態物理級鎖定：專為週報分頁設計，徹底消滅捲軸且絕對不影響其他分頁 */
  body.weekly-mode {
    height: 100dvh !important;
    overflow: hidden !important;
  }
  body.weekly-mode .app {
    height: 100dvh !important;
    overflow: hidden !important;
    padding-bottom: 10px !important;
  }

  .icon-btn{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    width:38px;height:38px;border-radius:10px;font-size:17px;cursor:pointer;flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:active{transform:scale(0.96);}

  .top-sticky-zone {
    position: sticky; top: 0; z-index: 1000; background: var(--bg);
    padding-top: 20px; padding-bottom: 18px; margin-bottom: 0;
  }

  .tabs{
    display:flex;align-items:flex-end;justify-content:space-between;
    border-bottom:1px solid var(--border); padding-bottom:14px; overflow-x: auto;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .new-order-row{ display:flex;gap:10px; padding-top:18px; }
  .new-order-btn{
    flex:1;padding:16px 8px;border-radius:16px;border:2px dashed var(--amber);
    background:transparent;color:var(--amber);font-weight:600;font-size:15px; cursor:pointer;font-family:inherit;
  }
  .new-order-btn:active{background:var(--amber-dim);}

  .linked-btn{
    flex:1;padding:16px 8px;border-radius:16px;border:2px dashed var(--green);
    background:transparent;color:var(--green);font-weight:600;font-size:15px; cursor:pointer;font-family:inherit;
  }
  .linked-btn:active{background:var(--green-dim);}

  .link-badge{
    display:inline-block;font-size:11px;font-weight:600;color:var(--green);
    background:var(--green-dim);border-radius:6px;padding:2px 7px;margin-left:8px;
  }

  .trash-row{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;margin-bottom:10px;
  }
  .trash-info{min-width:0;flex:1;}
  .trash-ordno{font-size:15px;font-weight:700;color:var(--text);font-family:system-ui,monospace;font-variant-numeric:tabular-nums;}
  .trash-meta{font-size:12px;color:var(--muted);margin-top:4px;font-family:system-ui,monospace;font-variant-numeric:tabular-nums;}
  .trash-restore-btn{
    flex:0 0 auto;background:var(--green);color:var(--on-green);border:none;
    border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700; cursor:pointer;font-family:inherit;
  }
  .trash-restore-btn:active{transform:scale(0.96);}
  
  .active-header{display:flex;align-items:center;justify-content:space-between;margin:0 2px 10px;}
  .active-header h2{font-size:14px;color:var(--muted);font-weight:600;margin:0;}
  .active-header .count{font-family:system-ui,monospace;font-variant-numeric:tabular-nums;font-size:13px;color:var(--amber);}

  .swipe-card-wrap{position:relative;margin-bottom:10px;border-radius:14px;overflow:hidden; transition: background-color 0.2s ease;}
  .order-card{
    position:relative;background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:12px 14px;touch-action:pan-y; z-index:1;
  }
  .ordno-price-row{display:flex;gap:8px;margin-bottom:10px;}
  
  .ordno-input, .price-input { cursor: text; caret-color: var(--amber); }
  .ordno-input.vk-active, .price-input-wrap.vk-active {
    border-color: var(--amber) !important; box-shadow: 0 0 0 1px var(--amber);
  }

  .ordno-input{
    flex:1.8;min-width:0;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;
    padding:8px 10px;font-family:system-ui,monospace;font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;
    text-align:center;letter-spacing:1px;color:var(--text);
  }
  .ordno-input:focus{outline:none;}
  .ordno-input::placeholder{font-weight:400;font-size:13px;letter-spacing:normal;}
  
  .price-input-wrap{
    flex:0.8;min-width:0;display:flex;align-items:center;gap:2px;
    background:var(--panel-2);border:1px solid var(--border);border-radius:10px;
    padding:8px 10px; transition: border-color 0.2s, box-shadow 0.2s;
  }
  .price-input-wrap span{font-size:14px;color:var(--muted);}
  .price-input-wrap.locked-price { opacity: 0.5; pointer-events: none; }

  .price-input{
    flex:1;min-width:0;width:100%;background:transparent;border:none;outline:none !important;
    color:var(--text);font-family:system-ui,monospace;font-variant-numeric:tabular-nums;font-size:18px;font-weight:700;
    text-align:right;-moz-appearance:textfield;appearance:textfield;
  }
  .price-input::-webkit-outer-spin-button,.price-input::-webkit-inner-spin-button{ -webkit-appearance:none;margin:0; }
  .price-input::placeholder{font-weight:400;font-size:13px;letter-spacing:normal;}
  
  .order-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .order-start{font-size:12px;color:var(--muted);}
  .order-start b{color:var(--text);font-family:system-ui,sans-serif;}

  .order-status-row{ display:flex;align-items:baseline;justify-content:space-between;gap:10px; }
  .order-timer{ font-family:system-ui,monospace;font-variant-numeric:tabular-nums;font-size:20px;font-weight:600; letter-spacing:0.5px;flex-shrink:0; }
  .order-fee{font-size:11px;color:var(--muted);text-align:right;font-family:system-ui,monospace;font-variant-numeric:tabular-nums;}
  .order-fee.over{color:var(--amber);}

  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px;}
  .summary .card{ background:var(--panel);border:1px solid var(--border);border-radius:14px; padding:12px 10px; }
  .summary .card .label{font-size:11px;color:var(--muted);line-height:1.4;}
  .summary .card .value{font-family:system-ui,monospace;font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;margin-top:4px;}
  .empty{font-size:13px;color:var(--muted);text-align:center;padding:20px 0;}

  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;
    align-items:center;justify-content:center;z-index:9900;padding:20px;
  }
  .overlay.show{display:flex;}
  .settings-panel{
    width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);
    border-radius:16px;padding:20px;
  }
  .settings-panel h3{margin:0 0 6px;font-size:16px;}
  .settings-panel .hint{font-size:12px;color:var(--muted);margin:0 0 16px;line-height:1.6;}
  #deleteRowInfo{font-family:system-ui,monospace;font-variant-numeric:tabular-nums;}
  .settings-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .settings-row label{font-size:13px;color:var(--muted);}
  .settings-row input[type=number]{
    width:70px;background:transparent;border:none;outline:none;color:var(--text);
    font-family:system-ui,monospace;font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;text-align:right;
  }
  .settings-actions{display:flex;gap:10px;margin-top:6px;}
  .settings-actions button{ flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit; }
  .settings-actions .cancel{background:transparent;border:1px solid var(--border);color:var(--muted);}
  .settings-actions .confirm{background:var(--amber);border:none;color:var(--on-amber);}

  .clear-all{font-size:12px;color:var(--muted);background:none;border:none;text-decoration:underline;cursor:pointer;font-family:system-ui,sans-serif;}
  .history-actions{display:flex;align-items:center;justify-content:space-between;margin-top:14px;}
  .export-btn{
    background:var(--panel-2);border:1px solid var(--border);color:var(--text);
    font-size:13px;padding:9px 14px;border-radius:10px;cursor:pointer; font-family:system-ui,sans-serif;
  }
  .export-btn:active{transform:scale(0.97);}

  /* 🚀 明細表格：所有 11 個欄位一視同仁，完全等分均分、並壓縮字距 */
  .export-table{width:100%;table-layout:fixed;border-collapse:collapse;margin-top:4px;font-size:11px;}
  .export-table th,.export-table td{
    padding:6px 0px;text-align:center;border-bottom:1px solid var(--border);
    font-family:system-ui,monospace;font-variant-numeric:tabular-nums;white-space:normal;word-break:break-word;overflow-wrap:break-word;
    letter-spacing:-0.3px;
  }
  .export-table th{color:var(--muted);font-weight:600;font-size:10px;text-align:center;}
  .export-table th.sortable{cursor:pointer;user-select:none;transition:color 0.2s;}
  .export-table th.sortable:hover{color:var(--text);}
  
  .export-table tbody tr:last-child td{border-bottom:none;}
  .row-id-cell{-webkit-user-select:none;user-select:none;cursor:pointer;}
  .export-table tfoot td{border-top:1px solid var(--border);border-bottom:none;color:var(--amber);font-weight:600;padding-top:10px;}
  .export-table-scroll{overflow-x:hidden;}
  
  .detail-edit-input{
    width:100%;background:transparent;border:none;border-bottom:1px solid transparent;
    color:var(--text);font-family:system-ui,monospace;font-variant-numeric:tabular-nums;font-size:11px;
    text-align:center;padding:2px 0;min-width:0;box-sizing:border-box;
    letter-spacing:-0.3px;
  }
  .detail-edit-input:focus{outline:none;border-bottom:1px solid var(--amber);}
  
  .num-edit-input{-moz-appearance:textfield;appearance:textfield;}
  .num-edit-input::-webkit-outer-spin-button,.num-edit-input::-webkit-inner-spin-button{ -webkit-appearance:none;margin:0; }
  .ordno-edit-input{font-weight:600;}

  .export-empty{font-size:13px;color:var(--muted);text-align:center;padding:16px 0;}

  .tab-group{display:flex;gap:18px;}
  .brand-label{font-family:'Poppins',sans-serif;font-size:24px;font-weight:500;padding-bottom:5px;letter-spacing:0.2px;}
  .brand-uber{color:var(--brand-uber-color);}
  .brand-eats{color:var(--green);}
  .tab-btn{
    background:none;border:none;border-bottom:2px solid transparent;
    padding:9px 2px;color:var(--muted);font-weight:600;font-size:14px; cursor:pointer;font-family:inherit; white-space:nowrap;
  }
  .tab-btn.active{color:var(--amber);border-bottom-color:var(--amber);}
  .tab-panel{display:none; flex:1;}
  .tab-panel.active{display:flex; flex-direction:column;}

  #tabWeekly.active {
    overflow: hidden !important;
  }

  .theme-option-row{display:flex;gap:12px;flex-wrap:wrap;}
  .theme-option{
    flex:1;min-width:100px;display:flex;flex-direction:column;align-items:center;gap:10px;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;
    padding:16px 10px;cursor:pointer;font-family:inherit;
  }
  .theme-option.active{border:2px solid var(--amber);}
  .theme-swatch{ width:100%;height:48px;border-radius:8px;border:1px solid var(--border); display:block; }
  .theme-swatch-dark{background:#1B1F24;}
  .theme-swatch-light{background:#FFFFFF;}
  .theme-swatch-cyberpunk{background:linear-gradient(135deg,#FF2A6D 0%,#0A0E17 55%,#05D9E8 100%);}
  .theme-option-label{font-size:13px;color:var(--text);font-weight:600;text-align:center;line-height:1.5;}
  .theme-option-sub{font-size:11px;color:var(--muted);font-weight:400;}

  .vk-container {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 10000;
    background: var(--panel); border-top: 1px solid var(--border);
    padding: 14px 10px 24px; box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
    transform: translateY(100%); transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
    user-select: none; -webkit-user-select: none; display: flex; flex-direction: column;
  }
  .vk-container.show { transform: translateY(0); }
  .vk-layout { display: flex; flex-direction: column; width: 100%; max-width: 480px; margin: 0 auto; }
  .vk-row { display: flex; justify-content: center; gap: 6px; margin-bottom: 8px; }
  .vk-row:last-child { margin-bottom: 0; }
  .vk-key {
    flex: 1; background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; font-size: 24px; font-weight: 600; padding: 14px 0;
    cursor: pointer; font-family: system-ui, sans-serif; text-align: center;
    touch-action: manipulation; display: flex; align-items: center; justify-content: center;
  }
  .vk-key:active { background: var(--border); transform: scale(0.94); }
  .vk-key.action { font-size: 18px; }
  .vk-key.enter-key { background: var(--amber); color: var(--on-amber); border: none; }

  /* 週報與明細共用之高階頂部排版 */
  .week-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .week-title-wrap { display:flex; align-items:center; gap:6px; cursor:pointer; padding:6px 12px; border-radius:10px; transition: background 0.2s; }
  .week-title-wrap:active { background:var(--panel-2); }
  .week-title-str { font-size:15px; font-weight:600; font-family:system-ui,sans-serif; }
  .week-title-wrap svg { width:14px; height:14px; fill:currentColor; }
  
  .metrics-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:12px; }
  .metric-card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:2px; transition: all 0.2s ease;}
  .metric-card.main { grid-column: span 2; background: linear-gradient(135deg, var(--panel-2) 0%, var(--panel) 100%); align-items:center; padding:16px; }
  .metric-lbl { font-size:12px; color:var(--muted); font-weight:500; }
  .metric-val { font-size:16px; font-weight:700; color:var(--text); font-family:system-ui,monospace; font-variant-numeric:tabular-nums; }
  .metric-card.main .metric-val { font-size:32px; color:var(--amber); letter-spacing:-1px; margin-top:2px;}
  .metric-card.main .metric-lbl { font-size:13px; }

  /* 圖表區塊 */
  .chart-area { position:relative; width:100%; flex: 1; min-height: 160px; display:flex; margin-top:20px; margin-bottom:10px; }
  .chart-col { flex:1; display:flex; flex-direction:column; cursor:pointer; transition: opacity 0.2s ease; }
  .chart-area.has-selection .chart-col:not(.active) { opacity: 0.3; }
  
  .chart-bar-zone { flex:1; display:flex; align-items:flex-end; justify-content:center; border-bottom:1px dashed var(--border); }
  .chart-bar { width:65%; background:var(--chart-blue); border-radius:4px 4px 0 0; transition: height 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
  
  .chart-label-group { height:40px; display:flex; flex-direction:column; align-items:center; justify-content:center; margin-top:4px; }
  .chart-date { font-size:13px; color:var(--text); font-family:system-ui,sans-serif; font-weight:600; line-height:1.2; }
  .chart-day { font-size:11px; color:var(--muted); font-family:system-ui,sans-serif; margin-top:2px; line-height:1.2; }

  /* 歷史週數選取清單 */
  .week-select-top { display:flex; justify-content:space-between; align-items:center; padding:20px; border-bottom:1px solid var(--border); }
  .week-select-top h2 { margin:0; font-size:22px; font-weight:700; }
  .week-select-close { background:none; border:none; color:var(--text); font-size:28px; cursor:pointer; line-height:1; }
  
  .week-select-legend { display:flex; justify-content:space-between; padding:12px 20px; background:var(--panel-2); font-size:13px; font-weight:600; color:var(--text); }
  .legend-days { display:flex; gap:4px; width:122px; }
  .legend-days span { width:14px; text-align:center; font-size:11px; color:var(--muted); font-weight:500; }
  
  .week-list { overflow-y:auto; flex:1; padding:0 20px; }
  .week-item { display:flex; justify-content:space-between; align-items:center; padding:16px 0; border-bottom:1px solid var(--border); cursor:pointer; }
  .week-item:active { opacity: 0.7; }
  .week-item-info { display:flex; flex-direction:column; gap:6px; flex:1; }
  .week-item-date { font-size:14px; color:var(--text); font-weight:600; font-family:system-ui,sans-serif; }
  .week-item-amt { font-size:18px; font-weight:700; color:var(--text); font-family:system-ui,monospace; font-variant-numeric:tabular-nums; }
  
  .mini-chart { display:flex; align-items:flex-end; gap:4px; height:65px; width:122px; }
  .mini-col { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; width:14px; height:100%; }
  .mini-bar { width:100%; background:var(--chart-blue); border-radius:2px 2px 0 0; }
  .mini-day { font-size:9px; color:var(--text); margin-top:5px; padding-bottom:3px; font-family:system-ui,monospace; font-variant-numeric:tabular-nums; width:100%; text-align:center;}

  /* 隱藏原生日曆圖示 */
  .date-no-icon::-webkit-calendar-picker-indicator { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; background: transparent; }
</style>
</head>
<body>
<div class="app">

  <div class="top-sticky-zone">
    <div class="tabs">
      <div class="tab-group">
        <button class="tab-btn active" data-tab="main">主控</button>
        <button class="tab-btn" data-tab="detail">明細</button>
        <button class="tab-btn" data-tab="weekly">週報</button>
        <button class="tab-btn" data-tab="settings">設定</button>
      </div>
      <span class="brand-label"><span class="brand-uber">Uber</span> <span class="brand-eats">Eats</span></span>
    </div>

    <div class="new-order-row" id="stickyNewOrderRow">
      <button class="new-order-btn" id="newOrderBtn">＋ 新增一單</button>
      <button class="linked-btn" id="newLinkedBtn">＋ 新增疊單</button>
    </div>
  </div>

  <div id="tabMain" class="tab-panel active">
    <div class="active-header">
      <h2>進行中的訂單</h2>
      <span class="count" id="activeCount">0 單</span>
    </div>
    <div id="activeList"><div class="empty">目前沒有進行中的訂單</div></div>

    <div class="summary">
      <div class="card">
        <div class="label">今日趟數</div>
        <div class="value" id="todayCount">0</div>
      </div>
      <div class="card">
        <div class="label">基本報酬</div>
        <div class="value" id="todayBaseSum">NT$0</div>
      </div>
      <div class="card">
        <div class="label">差額補償</div>
        <div class="value" id="todayFeeSum">NT$0</div>
      </div>
    </div>
  </div>

  <div id="tabDetail" class="tab-panel">
    <div class="week-header" id="singleDateRow">
      <button class="icon-btn" id="prevDayBtn">&lt;</button>
      <div class="week-title-wrap" style="position:relative; min-width:140px; justify-content:center;">
        <span id="singleDateDisplay" class="week-title-str" style="pointer-events:none; letter-spacing:0.5px;"></span>
        <input type="date" id="singleDateInput" class="date-no-icon" style="position:absolute; top:0; left:0; width:100%; height:100%; opacity:0; cursor:pointer; margin:0; padding:0; box-sizing:border-box;">
      </div>

<script>
// 全域常數
const KEY_ACTIVE = 'meter_active';
const KEY_ORDERS = 'meter_orders';
const KEY_TRASH = 'meter_trash';
const KEY_THEME = 'meter_theme';

let active = [];
let orders = [];
let trashItems = [];

let sortCol = null;
let sortAsc = true;

let weeklyDataCache = [];
let currentViewingWeekIndex = 0;
let selectedDayIndex = null;

const $ = id => document.getElementById(id);

function escapeHTML(str) {
  return String(str || '').replace(/[&<>"'`=\/]/g, function(s){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;','/':'&#x2F;','=':'&#x3D;'}[s];
  });
}

function syncActiveToAndroid() {
  if (window.AndroidDownloader && window.AndroidDownloader.syncActiveOrders) {
    const list = active.map(o => {
      let no = (o.orderNo || '').replace(/[^A-Za-z0-9]/g, '');
      if (no.length > 3) no = no.slice(-3);
      if (!no) no = '---';
      return { 
        id: o.id, no: no, startTs: o.startTs, basePrice: o.basePrice || 0,
        linkGroupId: o.linkGroupId || '', linkRole: o.linkRole || ''
      };
    });
    window.AndroidDownloader.syncActiveOrders(JSON.stringify(list));
  }
}

window.completeOrderById = function(id) { completeOrder(id); };
window.cancelOrderById = function(id) { cancelOrder(id); };

window.reorderActiveOrders = function(jsonStr) {
  try {
    const idList = JSON.parse(jsonStr);
    const newActive = [];
    idList.forEach(id => {
      const idx = active.findIndex(a => a.id === id);
      if (idx > -1) { newActive.push(active[idx]); active.splice(idx, 1); }
    });
    newActive.push(...active); active = newActive;
    saveJSON(KEY_ACTIVE, active); renderActive(); 
  } catch(e) {}
};

function reportUiState() {
  if (window.AndroidDownloader && window.AndroidDownloader.updateUiState) {
    const vkOpen = $('vkContainer').classList.contains('show');
    const overlayOpen = document.querySelectorAll('.overlay.show').length > 0;
    window.AndroidDownloader.updateUiState(vkOpen || overlayOpen);
  }
}

function loadJSON(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function saveJSON(key, value){ try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){} }
function genId(){ return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,7); }

function fmtHHMM(ts){ const d = new Date(ts); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function parseTimeInput(str){
  str = (str || '').trim(); if(!str) return null; let h, m;
  if(str.includes(':')){ const parts = str.split(':'); if(parts.length !== 2) return null; h = parseInt(parts[0], 10); m = parseInt(parts[1], 10); }
  else{
    const digits = str.replace(/\D/g, '');
    if(digits.length === 3){ h = parseInt(digits.slice(0,1), 10); m = parseInt(digits.slice(1), 10); }
    else if(digits.length === 4){ h = parseInt(digits.slice(0,2), 10); m = parseInt(digits.slice(2), 10); } else return null;
  }
  if(isNaN(h) || isNaN(m) || h < 0 || h > 23 || m < 0 || m > 59) return null;
  return { h, m };
}
function fmtMMSS(ms){
  const totalSec = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(totalSec/60); const s = totalSec%60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function money(n){ return 'NT$' + (Math.round(n*10)/10).toLocaleString('en-US'); }
function plainNum(n){ const r = Math.round(n*10)/10; return Number.isInteger(r) ? String(r) : r.toFixed(1); }
function fmtDisplayMoney(n){ return '$' + n.toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:2}); }
function formatHrs(ms) { return (ms / 3600000).toFixed(1) + 'h'; }
function formatHrRate(total, ms) { const hrs = ms / 3600000; if(hrs <= 0) return '$0/h'; return '$' + Math.round(total / hrs).toLocaleString() + '/h'; }
function formatAvg(total, count) { if(count <= 0) return '$0'; return '$' + Math.round(total / count).toLocaleString(); }

function getBilledMinutes(startTs, endTs) {
  const totalSec = Math.max(0, Math.floor((endTs - startTs) / 1000)); const m = Math.floor(totalSec / 60); const s = totalSec % 60; return s >= 30 ? m + 1 : m;
}
function getLegalMinPrice(mins) { const val = mins * (245 / 60); return Math.max(45, Math.ceil(val * 10) / 10); }
function getCoveredMin(basePrice, isLinked) {
  const bp = basePrice || 0; let m = 0;
  while(m <= 120) { let leg = getLegalMinPrice(m + 1); if (isLinked) leg *= 2; if (leg > bp) break; m++; } return m;
}
function calcOrderSubsidy(o, endTs) {
  const billedMin = getBilledMinutes(o.startTs, endTs); const legalMin = getLegalMinPrice(billedMin);
  const isLinked = !!o.linkGroupId; const bp = o.basePrice || 0;
  const covered = getCoveredMin(bp, isLinked); const actualExtraMin = Math.max(0, billedMin - covered);
  if (isLinked) {
    if (o.linkRole === 'secondary') return { billedMin, extraMin: 0, legalTotal: legalMin, extraFee: 0 };
    const totalLegal = legalMin * 2; const extraFee = Math.max(0, totalLegal - bp);
    return { billedMin, extraMin: actualExtraMin, legalTotal: totalLegal, extraFee: Math.round(extraFee * 10) / 10 };
  }
  const extraFee = Math.max(0, legalMin - bp); return { billedMin, extraMin: actualExtraMin, legalTotal: legalMin, extraFee: Math.round(extraFee * 10) / 10 };
}
function getExactTimes(o) {
  const ms = Math.max(0, o.endTs - o.startTs); const elapsed = fmtMMSS(ms);
  if (o.excludeBaseFromTotal) return { elapsed, over: '-' };
  let thresholdMin = 0;
  while (thresholdMin <= 120) { let legal = getLegalMinPrice(thresholdMin); if (o.linkGroupId) legal *= 2; if (legal > (o.basePrice || 0)) break; thresholdMin++; }
  let targetSec = thresholdMin * 60 - 30; if (thresholdMin === 0) targetSec = 0;
  const targetTs = o.startTs + targetSec * 1000; const overMs = Math.max(0, o.endTs - targetTs);
  return { elapsed, over: overMs > 0 ? fmtMMSS(overMs) : '-' };
}
function getFeeStatus(o, now) {
  if(!o.basePrice || o.basePrice <= 0) return { text: '請先輸入單價', over: false };
  if(o.linkRole === 'secondary') return { text: '差額併入 A 單', over: false };
  const { extraFee } = calcOrderSubsidy(o, now); let thresholdMin = 0;
  while (thresholdMin <= 120) { let legal = getLegalMinPrice(thresholdMin); if (o.linkGroupId) legal *= 2; if (legal > (o.basePrice || 0)) break; thresholdMin++; }
  let targetSec = thresholdMin * 60 - 30; if (thresholdMin === 0) targetSec = 0;
  const targetTs = o.startTs + targetSec * 1000;
  if(extraFee > 0){ return { text: `已超時 <span style="font-family:system-ui,monospace;font-variant-numeric:tabular-nums;">${fmtMMSS(Math.max(0, now - targetTs))}</span>，+${money(extraFee)}`, over: true }; }
  if (targetTs > now) return { text: `還有 <span style="font-family:system-ui,monospace;font-variant-numeric:tabular-nums;">${fmtMMSS(targetTs - now)}</span> 開始補差額`, over: false };
  return { text: '尚未達標', over: false };
}
function getMondayTs(ts) { const d = new Date(ts); const day = d.getDay() || 7; d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (day - 1)); return d.getTime(); }
function fmtMd(ts) { const d = new Date(ts); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; }

function calculateMergedActiveMs(orderList) {
  const intervals = [];
  orderList.forEach(o => {
    if (!o.excludeBaseFromTotal && o.endTs > o.startTs) {
      intervals.push([o.startTs, o.endTs]);
    }
  });
  if (intervals.length === 0) return 0;
  intervals.sort((a, b) => a[0] - b[0]);
  
  let merged = [intervals[0]];
  for (let i = 1; i < intervals.length; i++) {
    let prev = merged[merged.length - 1];
    let curr = intervals[i];
    if (curr[0] <= prev[1]) {
      prev[1] = Math.max(prev[1], curr[1]);
    } else {
      merged.push(curr);
    }
  }
  
  let totalMs = 0;
  merged.forEach(interval => {
    totalMs += (interval[1] - interval[0]);
  });
  return totalMs;
}

function computeWeeklyData() {
  try {
    if (orders.length === 0) { weeklyDataCache = []; return; }
    let minTs = Date.now(); let maxTs = Date.now();
    orders.forEach(o => { if (o.startTs < minTs) minTs = o.startTs; if (o.startTs > maxTs) maxTs = o.startTs; });
    const startWeekTs = getMondayTs(minTs); const endWeekTs = getMondayTs(maxTs);
    const weeksMap = {}; let curr = startWeekTs;
    while (curr <= endWeekTs) {
      const endTs = curr + 6 * 86400000; 
      weeksMap[curr] = {
        mondayTs: curr, dateRangeStr: `${fmtMd(curr)} - ${fmtMd(endTs)}`,
        total: 0, activeMs: 0, maxDayTotal: 0, allOrders: [],
        days: Array.from({length: 7}, (_, i) => ({
          ts: curr + i * 86400000, dayNum: new Date(curr + i * 86400000).getDate(),
          dayName: ['星期一','星期二','星期三','星期四','星期五','星期六','星期日'][i],
          total: 0, count: 0, baseSum: 0, feeSum: 0, bonusSum: 0, tipSum: 0, activeMs: 0, dayOrders: []
        }))
      };
      curr += 7 * 86400000;
    }
    orders.forEach(o => {
      const mTs = getMondayTs(o.startTs); const w = weeksMap[mTs];
      if (w) {
        const dayIdx = (new Date(o.startTs).getDay() || 7) - 1; const d = w.days[dayIdx];
        const bPrice = o.excludeBaseFromTotal ? 0 : (o.basePrice || 0);
        const eFee = o.extraFee || 0; const bonus = o.bonus || 0; const tip = o.tip || 0;
        const oTotal = o.total || (bPrice + eFee + bonus + tip);
        
        w.total += oTotal; d.total += oTotal; d.count += 1;
        d.baseSum += bPrice; d.feeSum += eFee; d.bonusSum += bonus; d.tipSum += tip;
        
        w.allOrders.push(o);
        d.dayOrders.push(o);
      }
    });
    Object.values(weeksMap).forEach(w => {
      w.activeMs = calculateMergedActiveMs(w.allOrders);
      let max = 0;
      w.days.forEach(d => {
        d.activeMs = calculateMergedActiveMs(d.dayOrders);
        if(d.total > max) max = d.total;
      });
      w.maxDayTotal = max || 1;
    });
    weeklyDataCache = Object.values(weeksMap).sort((a, b) => b.mondayTs - a.mondayTs);
  } catch (e) { console.error("Weekly computing err:", e); }
}

function initChartDOM() {
  const wrap = $('mainChartWrap');
  if (!wrap || !wrap.querySelector('.chart-col')) {
    if(wrap) wrap.innerHTML = Array.from({length: 7}, (_, i) => `
      <div class="chart-col" data-day-idx="${i}">
        <div class="chart-bar-zone"><div class="chart-bar" style="height: 0%;"></div></div>
        <div class="chart-label-group"><div class="chart-date">-</div><div class="chart-day">-</div></div>
      </div>
    `).join('');
  }
}

function renderWeeklyTab() {
  try {
    if(weeklyDataCache.length === 0) {
      $('weekTitleStr').textContent = '--';
      $('mTitle').textContent = '本週總收入'; $('mTotal').textContent = '$0';
      $('mBase').textContent = '$0'; $('mFee').textContent = '$0'; $('mBonus').textContent = '$0'; $('mTip').textContent = '$0';
      $('mCount').textContent = '0'; $('mAvg').textContent = '$0'; $('mTime').textContent = '0.0h'; $('mRate').textContent = '$0/h';
      initChartDOM();
      const chartWrap = $('mainChartWrap');
      if(chartWrap) {
        chartWrap.querySelectorAll('.chart-bar').forEach(bar => bar.style.height = '0%');
        chartWrap.className = 'chart-area';
      }
      return;
    }
    if(currentViewingWeekIndex >= weeklyDataCache.length) currentViewingWeekIndex = 0;
    if(currentViewingWeekIndex < 0) currentViewingWeekIndex = 0;
    const wData = weeklyDataCache[currentViewingWeekIndex];
    $('weekTitleStr').textContent = wData.dateRangeStr;
    $('prevWeekBtn').style.opacity = currentViewingWeekIndex < weeklyDataCache.length - 1 ? '1' : '0.2';
    $('nextWeekBtn').style.opacity = currentViewingWeekIndex > 0 ? '1' : '0.2';

    let dTotal, dCount, dActiveMs, dBase, dFee, dBonus, dTip;
    if(selectedDayIndex !== null) {
      const d = wData.days[selectedDayIndex];
      $('mTitle').textContent = `${d.dayNum}日 (${d.dayName}) 總收入`;
      dTotal = d.total; dCount = d.count; dActiveMs = d.activeMs;
      dBase = d.baseSum; dFee = d.feeSum; dBonus = d.bonusSum; dTip = d.tipSum;
    } else {
      $('mTitle').textContent = `本週總收入`;
      dTotal = wData.total; dActiveMs = wData.activeMs;
      dCount = wData.days.reduce((s,d)=>s+d.count, 0);
      dBase = wData.days.reduce((s,d)=>s+d.baseSum, 0);
      dFee = wData.days.reduce((s,d)=>s+d.feeSum, 0);
      dBonus = wData.days.reduce((s,d)=>s+d.bonusSum, 0);
      dTip = wData.days.reduce((s,d)=>s+d.tipSum, 0);
    }

    $('mTotal').textContent = fmtDisplayMoney(dTotal);
    $('mBase').textContent = `$${plainNum(dBase)}`; $('mFee').textContent = `$${plainNum(dFee)}`;
    $('mBonus').textContent = `$${plainNum(dBonus)}`; $('mTip').textContent = `$${plainNum(dTip)}`;
    $('mCount').textContent = dCount; $('mAvg').textContent = formatAvg(dTotal, dCount);
    $('mTime').textContent = formatHrs(dActiveMs); $('mRate').textContent = formatHrRate(dTotal, dActiveMs);

    initChartDOM(); 
    const chartWrap = $('mainChartWrap');
    if(chartWrap) {
      wData.days.forEach((d, idx) => {
        const col = chartWrap.querySelector(`[data-day-idx="${idx}"]`);
        if(col) {
          col.className = `chart-col ${selectedDayIndex === idx ? 'active' : ''}`;
          const barHeight = (d.total > 0 && wData.maxDayTotal > 0) ? (d.total / wData.maxDayTotal) * 100 : 0;
          col.querySelector('.chart-bar').style.height = `${barHeight}%`;
          col.querySelector('.chart-date').textContent = d.dayNum;
          col.querySelector('.chart-day').textContent = d.dayName;
        }
      });
      chartWrap.className = `chart-area ${selectedDayIndex !== null ? 'has-selection' : ''}`;
    }
  } catch(e) { console.error('Weekly render err:', e); }
}

$('mainChartWrap').addEventListener('click', e => {
  if (weeklyDataCache.length === 0) return; 
  const col = e.target.closest('.chart-col');
  if (col) {

let activeVkInput = null; let activeVkWrapper = null;
function openVk(inputEl, layout) {
  if (activeVkInput && activeVkInput !== inputEl) activeVkInput.blur();
  if (activeVkWrapper) activeVkWrapper.classList.remove('vk-active');
  activeVkInput = inputEl; activeVkInput.focus();
  activeVkWrapper = inputEl.classList.contains('price-input') ? inputEl.closest('.price-input-wrap') : inputEl;
  activeVkWrapper.classList.add('vk-active');
  $('vkNumpad').style.display = layout === 'numpad' ? 'flex' : 'none';
  $('vkHex').style.display = layout === 'hex' ? 'flex' : 'none';
  
  const vkContainer = $('vkContainer'); const vkHeight = vkContainer.offsetHeight || 220;
  document.body.style.paddingBottom = (vkHeight + 40) + 'px';
  requestAnimationFrame(() => {
    vkContainer.classList.add('show'); reportUiState();
    setTimeout(() => {
      const cardWrap = inputEl.closest('.swipe-card-wrap');
      if (cardWrap) {
        const actualVkHeight = vkContainer.offsetHeight; const rect = cardWrap.getBoundingClientRect();
        const safeBottom = window.innerHeight - actualVkHeight - 10;
        if (rect.bottom > safeBottom) window.scrollBy({ top: rect.bottom - safeBottom, behavior: 'smooth' });
        else if (rect.top < 160) window.scrollBy({ top: rect.top - 160, behavior: 'smooth' });
      }
    }, 180);
  });
}
function closeVk() {
  if (activeVkInput) activeVkInput.blur(); 
  if (activeVkWrapper) activeVkWrapper.classList.remove('vk-active'); 
  activeVkInput = null; activeVkWrapper = null;
  $('vkContainer').classList.remove('show'); document.body.style.paddingBottom = ''; reportUiState();
}
function handleVkKey(key) {
  if (!activeVkInput) return;
  if (key === 'ENTER' || key === 'CANCEL') { closeVk(); return; }
  let val = activeVkInput.value; let start = activeVkInput.selectionStart || 0; let end = activeVkInput.selectionEnd || 0;
  if (key === 'BACKSPACE') {
    if (start === end && start > 0) { val = val.slice(0, start - 1) + val.slice(end); activeVkInput.value = val; activeVkInput.setSelectionRange(start - 1, start - 1); } 
    else if (start !== end) { val = val.slice(0, start) + val.slice(end); activeVkInput.value = val; activeVkInput.setSelectionRange(start, start); }
  } else {
    if (start === end) {
      if (activeVkInput.classList.contains('ordno-input') && val.length >= 10) return;
      if (activeVkInput.classList.contains('price-input') && val.length >= 6) return;
    }
    val = val.slice(0, start) + key + val.slice(end); activeVkInput.value = val; activeVkInput.setSelectionRange(start + key.length, start + key.length);
  }
  activeVkInput.dispatchEvent(new Event('input', { bubbles: true }));
}
$('vkContainer').addEventListener('pointerdown', e => { e.preventDefault(); const btn = e.target.closest('.vk-key'); if (btn) handleVkKey(btn.getAttribute('data-key') || btn.textContent.trim()); });
let vkPointerDownX = 0; let vkPointerDownY = 0; window.swipeDragging = false; 
document.addEventListener('pointerdown', e => { vkPointerDownX = e.clientX; vkPointerDownY = e.clientY; });
document.addEventListener('pointerup', e => {
  if (!$('vkContainer').classList.contains('show')) return; if (e.target.closest('#vkContainer')) return; 
  if (Math.abs(e.clientX - vkPointerDownX) > 10 || Math.abs(e.clientY - vkPointerDownY) > 10) return;
  if (e.target.closest('input')) return; closeVk();
});
document.addEventListener('keydown', e => {
  if (!$('vkContainer').classList.contains('show') || !activeVkInput) return; const key = e.key.toUpperCase();
  if (key === 'ENTER') { e.preventDefault(); handleVkKey('ENTER'); } else if (key === 'BACKSPACE') { e.preventDefault(); handleVkKey('BACKSPACE'); }
  else if (key === 'ESCAPE') { e.preventDefault(); handleVkKey('CANCEL'); } else if (/^[A-Z0-9]$/.test(key)) { e.preventDefault(); handleVkKey(key); }
});

            <span class="order-fee${feeStatus.over ? ' over' : ''}" data-fee="${o.id}">${feeStatus.text}</span>
          </div>
        </div>
      </div>`;
    }).join('');
    initCardSwipe();
    const wraps = Array.from(list.querySelectorAll('.swipe-card-wrap')); const animating = [];
    wraps.forEach((el, idx)=>{
      const id = el.getAttribute('data-swipe-card'); const prev = prevRects[id]; el.style.zIndex = String(wraps.length - idx);
      if(!prev) return; const next = el.getBoundingClientRect(); const dy = prev.top - next.top; if(Math.abs(dy) < 1) return; animating.push({ el, dy });
    });
    animating.forEach(({el, dy})=>{ el.style.transition = 'none'; el.style.transform = `translateY(${dy}px)`; });
    if(animating.length){
      void list.offsetHeight;
      requestAnimationFrame(()=>{
        animating.forEach(({el})=>{ el.style.transition = 'transform 0.15s ease'; el.style.transform = 'translateY(0)'; });
        setTimeout(()=>{ animating.forEach(({el})=>{ el.style.transition = ''; el.style.transform = ''; el.style.zIndex = ''; }); }, 170);
      });
    }
    if(pendingNewIds.length){
      const newEls = pendingNewIds.map(id => list.querySelector(`.swipe-card-wrap[data-swipe-card="${id}"]`)).filter(Boolean);
      const pushDelay = animating.length ? 70 : 0;
      newEls.forEach(el=>{ el.style.transition = 'none'; el.style.transform = 'scale(0.92)'; el.style.opacity = '0'; });
      if(newEls.length){
        void list.offsetHeight;
        setTimeout(()=>{
          newEls.forEach(el=>{ el.style.transition = 'transform 0.15s ease, opacity 0.15s ease'; el.style.transform = 'scale(1)'; el.style.opacity = '1'; });
          setTimeout(()=>{ newEls.forEach(el=>{ el.style.transition = ''; el.style.transform = ''; el.style.opacity = ''; }); }, 170);
        }, pushDelay);
      }
      pendingNewIds = [];
    }
  } catch(e) { console.error('Active List Render Err:', e); }
}

function initCardSwipe(){
  document.querySelectorAll('.swipe-card-wrap').forEach(wrap=>{
    const id = wrap.getAttribute('data-swipe-card'); const card = wrap.querySelector('.order-card');
    let dragging = false, decided = false, cancelled = false, startX = 0, startY = 0, currentX = 0;
    function onPointerDown(e){ dragging = true; decided = false; cancelled = false; currentX = 0; startX = e.clientX; startY = e.clientY; card.style.transition = 'none'; wrap.style.backgroundColor = 'transparent'; }
    function onPointerMove(e){
      if(!dragging) return;
      const dx = e.clientX - startX; const dy = e.clientY - startY;
      if(!decided){
        if(Math.abs(dx) < 10 && Math.abs(dy) < 10) return; 
        decided = true;
        if(Math.abs(dy) > Math.abs(dx)){ cancelled = true; dragging = false; return; }
        card.setPointerCapture(e.pointerId); window.swipeDragging = true;
        if (document.activeElement && card.contains(document.activeElement)) document.activeElement.blur(); closeVk();
      }
      if(cancelled) return; currentX = dx; card.style.transform = `translateX(${currentX}px)`;
      if (currentX > 0) wrap.style.backgroundColor = 'var(--green)'; else if (currentX < 0) wrap.style.backgroundColor = 'var(--red)';
    }
    function onPointerUp(e){
      if(!dragging) return; dragging = false; if(cancelled) return;
      const maxDist = wrap.clientWidth * 0.25; card.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
      if(currentX >= maxDist){ card.style.transform = `translateX(${wrap.clientWidth}px)`; card.style.opacity = '0'; setTimeout(()=> completeOrder(id), 180); }
      else if(currentX <= -maxDist){ card.style.transform = `translateX(-${wrap.clientWidth}px)`; card.style.opacity = '0'; setTimeout(()=> cancelOrder(id), 180); }
      else { card.style.transform = 'translateX(0)'; wrap.style.backgroundColor = 'transparent'; }
      currentX = 0; setTimeout(()=>{ window.swipeDragging = false; }, 50); 
    }
    wrap.addEventListener('pointerdown', onPointerDown); wrap.addEventListener('pointermove', onPointerMove); wrap.addEventListener('pointerup', onPointerUp); wrap.addEventListener('pointercancel', onPointerUp);
  });
}

function completeOrder(id){
  try {
    const idx = active.findIndex(a=>a.id===id); if(idx === -1) return;
    const o = active[idx]; const endTs = Date.now();
    let toComplete = o.linkGroupId ? active.filter(a => a.linkGroupId === o.linkGroupId) : [o];
    toComplete.forEach(item => {
      const { billedMin, extraMin, extraFee } = calcOrderSubsidy(item, endTs);
      const isSec = item.linkRole === 'secondary';
      const record = {
        id: genId(), orderNo: item.orderNo || '', basePrice: item.basePrice || 0,
        excludeBaseFromTotal: isSec, startTs: item.startTs, endTs,
        elapsedMinCeil: billedMin, extraMin: extraMin, extraFee: extraFee, bonus: 0, tip: 0,
        total: (isSec ? 0 : (item.basePrice || 0)) + extraFee, linkGroupId: item.linkGroupId, linkRole: item.linkRole
      };
      orders.unshift(record); const rIdx = active.findIndex(a => a.id === item.id); if(rIdx > -1) active.splice(rIdx,1);
    });
    saveJSON(KEY_ACTIVE, active); saveJSON(KEY_ORDERS, orders); syncActiveToAndroid(); 
    closeVk(); renderActive(); computeTodaySummary(); computeWeeklyData(); renderWeeklyTab(); renderDetailTable();
  } catch(e) { console.error('Complete Order Err:', e); }
}

function cancelOrder(id){

    const item = active[idx]; item.deletedAt = Date.now(); trashItems.unshift(item); active.splice(idx,1);

}

    const baseSum = list.reduce((s,o)=> s + (o.excludeBaseFromTotal ? 0 : o.basePrice), 0);
    const feeSum = list.reduce((s,o)=> s + o.extraFee, 0);
    const bonusSum = list.reduce((s,o)=> s + (o.bonus||0), 0);
    const tipSum = list.reduce((s,o)=> s + (o.tip||0), 0);
    
    let displayList = list.map((o, i) => { return { _obj: o, origIndex: i + 1, elapsedMs: o.endTs - o.startTs }; });
    if (sortCol) {
      displayList.sort((a, b) => {
        let valA, valB;
        if (sortCol === 'id') { valA = a.origIndex; valB = b.origIndex; }
        else if (sortCol === 'elapsed') { valA = a.elapsedMs; valB = b.elapsedMs; }
        else if (sortCol === 'overtime') { valA = a._obj.extraMin; valB = b._obj.extraMin; }
        else if (sortCol === 'base') { valA = a._obj.excludeBaseFromTotal ? -1 : (a._obj.basePrice || 0); valB = b._obj.excludeBaseFromTotal ? -1 : (b._obj.basePrice || 0); }
        else if (sortCol === 'fee') { valA = a._obj.excludeBaseFromTotal ? -1 : (a._obj.extraFee || 0); valB = b._obj.excludeBaseFromTotal ? -1 : (b._obj.extraFee || 0); }
        if (valA < valB) return sortAsc ? -1 : 1; if (valA > valB) return sortAsc ? 1 : -1; return 0;
      });
    }
    
    wrap.innerHTML = `
      <div class="export-table-scroll">
        <table class="export-table">
          <thead><tr>
            <th data-sort="id" class="sortable">編號</th>
            <th>單號</th>
            <th>日期</th>
            <th>開始</th><th>結束</th>
            <th data-sort="elapsed" class="sortable">用時</th>
            <th data-sort="overtime" class="sortable">超時</th>
            <th data-sort="base" class="sortable">單價</th>
            <th>加成</th>
            <th>小費</th>
            <th data-sort="fee" class="sortable">差額</th>
          </tr></thead>
          <tbody>
            ${displayList.map(item => {
              const o = item._obj; const t = getExactTimes(o);
              const displayFee = o.excludeBaseFromTotal ? '-' : (o.extraFee === 0 ? '-' : plainNum(o.extraFee));
              return `
              <tr>
                <td class="row-id-cell" data-row-id="${o.id}">${item.origIndex}</td>
                <td><input type="text" class="detail-edit-input ordno-edit-input" data-edit-ordno="${o.id}" value="${escapeHTML(o.orderNo)}" placeholder="-" autocapitalize="characters" autocomplete="off" spellcheck="false"></td>
                <td>${fmtDateOnly(o.startTs)}</td>
                <td><input type="text" inputmode="numeric" maxlength="5" class="detail-edit-input" data-edit-start="${o.id}" value="${fmtHHMM(o.startTs)}" placeholder="00:00"></td>
                <td><input type="text" inputmode="numeric" maxlength="5" class="detail-edit-input" data-edit-end="${o.id}" value="${fmtHHMM(o.endTs)}" placeholder="00:00"></td>
                <td>${t.elapsed}</td><td>${t.over}</td>
                <td>${o.excludeBaseFromTotal ? '-' : `<input type="number" inputmode="decimal" class="detail-edit-input num-edit-input" data-edit-base="${o.id}" value="${o.basePrice || ''}" min="0" placeholder="-">`}</td>
                <td>${o.excludeBaseFromTotal ? '-' : `<input type="number" inputmode="decimal" class="detail-edit-input num-edit-input" data-edit-bonus="${o.id}" value="${o.bonus || ''}" min="0" placeholder="-">`}</td>
                <td>${o.excludeBaseFromTotal ? '-' : `<input type="number" inputmode="decimal" class="detail-edit-input num-edit-input" data-edit-tip="${o.id}" value="${o.tip || ''}" min="0" placeholder="-">`}</td>
                <td>${displayFee}</td>
              </tr>`;
            }).join('')}
          </tbody>
          <tfoot><tr>
            <td colspan="5" style="text-align:right; padding-right:10px;">總計</td>
            <td></td><td></td>
            <td>${plainNum(baseSum)}</td>
            <td>${plainNum(bonusSum)}</td>
            <td>${plainNum(tipSum)}</td>
            <td>${plainNum(feeSum)}</td>
          </tr></tfoot>
        </table>
      </div><p id="editTimeError" style="font-size:11px;color:var(--red);margin-top:6px;display:none;"></p>
    `;
  } catch(e) { console.error('Render Detail Table Err:', e); }
}

let longPressTimer = null; let longPressStartX = 0, longPressStartY = 0; let pendingDeleteRowId = null;
function cancelLongPress(){ if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer = null; } }
$('exportPreviewWrap').addEventListener('pointerdown', e=>{      const cell = e.target.closest('.row-id-cell'); if(!cell) return;      longPressStartX = e.clientX; longPressStartY = e.clientY;      longPressTimer = setTimeout(()=>{ longPressTimer = null; openDeleteRowConfirm(cell.getAttribute('data-row-id'), cell.textContent.trim()); }, 600);  });$('exportPreviewWrap').addEventListener('pointerup', cancelLongPress); 
$('exportPreviewWrap').addEventListener('pointercancel', cancelLongPress);$('exportPreviewWrap').addEventListener('pointermove', e=>{
  if(!longPressTimer) return;
  if(Math.abs(e.clientX - longPressStartX) > 10 || Math.abs(e.clientY - longPressStartY) > 10) cancelLongPress();
});
function openDeleteRowConfirm(id, displayIdx){
  if(!orders.find(o=>o.id===id)) return;
  pendingDeleteRowId = id; $('deleteRowInfo').textContent = `確定要刪除第 ${displayIdx} 筆紀錄嗎？`; showOverlay('confirmDeleteRowOverlay');
}
$('confirmDeleteRowCancel').addEventListener('click', ()=>{ pendingDeleteRowId = null; hideOverlay('confirmDeleteRowOverlay'); });$('confirmDeleteRowOk').addEventListener('click', ()=>{
  if(pendingDeleteRowId){ orders = orders.filter(o=>o.id!==pendingDeleteRowId); saveJSON(KEY_ORDERS, orders); computeTodaySummary(); computeWeeklyData(); renderWeeklyTab(); renderDetailTable(); }
  pendingDeleteRowId = null; hideOverlay('confirmDeleteRowOverlay');
});

$('exportPreviewWrap').addEventListener('input', e=>{
  const ordnoId = e.target.getAttribute('data-edit-ordno'); if(!ordnoId) return;
  const upper = e.target.value.toUpperCase();
  if(e.target.value !== upper){ const cursorPos = e.target.selectionStart; e.target.value = upper; e.target.setSelectionRange(cursorPos, cursorPos); }
});

$('exportPreviewWrap').addEventListener('change', e=>{
  try {
    const baseId = e.target.getAttribute('data-edit-base'); const ordnoId = e.target.getAttribute('data-edit-ordno');
    const startId = e.target.getAttribute('data-edit-start'); const endId = e.target.getAttribute('data-edit-end');
    const bonusId = e.target.getAttribute('data-edit-bonus'); const tipId = e.target.getAttribute('data-edit-tip');
    
    if (baseId || bonusId || tipId) {
      const id = baseId || bonusId || tipId; const order = orders.find(o => o.id === id);
      if(order) {
        if(baseId) order.basePrice = parseFloat(e.target.value) || 0;
        if(bonusId) order.bonus = parseFloat(e.target.value) || 0;
        if(tipId) order.tip = parseFloat(e.target.value) || 0;
        
        const { extraMin, extraFee } = calcOrderSubsidy(order, order.endTs);
        order.extraMin = extraMin; order.extraFee = extraFee; 
        order.total = (order.excludeBaseFromTotal ? 0 : (order.basePrice || 0)) + extraFee + (order.bonus || 0) + (order.tip || 0);
        saveJSON(KEY_ORDERS, orders); computeTodaySummary(); computeWeeklyData(); renderDetailTable();
      }
      return;
    }
    if(ordnoId){
      const order = orders.find(o => o.id === ordnoId);
      if(order){ order.orderNo = e.target.value.toUpperCase(); saveJSON(KEY_ORDERS, orders); renderDetailTable(); }
      return;
    }
    if(startId || endId){
      const id = startId || endId; const order = orders.find(o => o.id === id); if(!order) return;
      const parsed = parseTimeInput(e.target.value);
      if(!parsed){
        const err = $('editTimeError'); err.textContent = '時間格式錯誤，請輸入如 14:30，已還原';
        err.style.display = 'block'; setTimeout(()=>{ err.style.display = 'none'; }, 3000); renderDetailTable(); return;
      }
      let newStartTs = order.startTs; let newEndTs = order.endTs;
      if(startId){ const d = new Date(order.startTs); d.setHours(parsed.h, parsed.m, 0, 0); newStartTs = d.getTime(); }
      else{ const d = new Date(order.endTs); d.setHours(parsed.h, parsed.m, 0, 0); newEndTs = d.getTime(); }
      if(newEndTs <= newStartTs){
        const err = $('editTimeError'); err.textContent = '完成時間必須晚於開始時間，已還原';
        err.style.display = 'block'; setTimeout(()=>{ err.style.display = 'none'; }, 3000); renderDetailTable(); return;
      }
      let group = order.linkGroupId ? orders.filter(o => o.linkGroupId === order.linkGroupId) : [order];
      group.forEach(go => {
        go.startTs = newStartTs; go.endTs = newEndTs; const { billedMin, extraMin, extraFee } = calcOrderSubsidy(go, newEndTs);
        go.elapsedMinCeil = billedMin; go.extraMin = extraMin; go.extraFee = extraFee;
        go.total = (go.linkRole === 'secondary' ? 0 : (go.basePrice || 0)) + extraFee + (go.bonus || 0) + (go.tip || 0);
      });
      saveJSON(KEY_ORDERS, orders); computeTodaySummary(); computeWeeklyData(); renderDetailTable();
    }
  } catch(e) { console.error('Export Preview change err:', e); }
});

function csvEscape(v){ return '"' + String(v ?? '').replace(/"/g,'""') + '"'; }

// 全局無損備份：新增額外收入、釋放記憶體
$('exportCsvBtn').addEventListener('click', ()=>{
  const list = [...orders].reverse();
  if(list.length === 0){ alert('目前沒有任何紀錄可以匯出'); return; }
  const header = ['編號','單號','日期','開始','結束','用時','超時','基本報酬','差額補償','加成','小費','疊單共用','系統開始戳','系統結束戳'];
  const rows = list.map((o,i) => {
    const t = getExactTimes(o);
    return [ i+1, o.orderNo || '', fmtDateFull(o.startTs), fmtHHMM(o.startTs), fmtHHMM(o.endTs), t.elapsed, t.over === '-' ? '' : t.over, 
             o.excludeBaseFromTotal ? '' : o.basePrice, o.excludeBaseFromTotal ? '' : (o.extraFee === 0 ? '' : o.extraFee),
             o.excludeBaseFromTotal ? '' : (o.bonus === 0 ? '' : o.bonus), o.excludeBaseFromTotal ? '' : (o.tip === 0 ? '' : o.tip),
             o.excludeBaseFromTotal ? '是' : '', o.startTs, o.endTs ];
  });
  const baseSum = list.reduce((s,o)=> s + (o.excludeBaseFromTotal ? 0 : o.basePrice), 0);
  const feeSum = list.reduce((s,o)=>s+o.extraFee,0);
  const bonusSum = list.reduce((s,o)=>s+(o.bonus||0),0); const tipSum = list.reduce((s,o)=>s+(o.tip||0),0);
  const totalRow = ['','總計','','','','','', baseSum.toFixed(1), feeSum.toFixed(1), bonusSum.toFixed(1), tipSum.toFixed(1), '', '', ''];
  const csv = '\uFEFF' + [header, ...rows, totalRow].map(r => r.map(csvEscape).join(',')).join('\r\n');
  
  if (window.AndroidDownloader) { window.AndroidDownloader.getBase64FromBlobData("data:text/csv;base64," + btoa(unescape(encodeURIComponent(csv))), 'text/csv'); } 
  else {
      const a = document.createElement('a'); const now = new Date();
      const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
      a.href = url; a.download = `外送紀錄_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.csv`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 200); 
  }
});

function showImportStatus(msg){ const el = $('importStatus'); el.textContent = msg; setTimeout(()=>{ if(el.textContent === msg) el.textContent = ''; }, 5000); }
function parseCsvLine(line){
  const result = []; let cur = ''; let inQuotes = false;
  for(let i = 0; i < line.length; i++){
    const ch = line[i];
    if(inQuotes){ if(ch === '"'){ if(line[i+1] === '"'){ cur += '"'; i++; } else { inQuotes = false; } }else{ cur += ch; } }
    else{ if(ch === '"'){ inQuotes = true; } else if(ch === ','){ result.push(cur); cur = ''; } else { cur += ch; } }
  }
  result.push(cur); return result;
}
$('importCsvBtn').addEventListener('click', ()=> $('importCsvInput').click());$('importCsvInput').addEventListener('change', e=>{
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const rows = reader.result.replace(/^\uFEFF/, '').split(/\r\n|\n/).filter(l => l.trim().length > 0).map(parseCsvLine);
      if(rows.length < 2){ showImportStatus('CSV內容是空的'); e.target.value=''; return; }
      const currentYear = new Date().getFullYear(); const imported = [];
      const headers = rows[0];
      const idxBase = headers.findIndex(h => h.includes('單價') || h.includes('基本報酬'));
      const idxFee = headers.findIndex(h => h.includes('差額'));
      const idxBonus = headers.findIndex(h => h.includes('加成'));
      const idxTip = headers.findIndex(h => h.includes('小費'));
      const idxExclude = headers.findIndex(h => h.includes('疊單共用'));
      const idxStartTs = headers.findIndex(h => h.includes('系統開始戳'));
      const idxEndTs = headers.findIndex(h => h.includes('系統結束戳'));
      
      rows.slice(1).forEach(r=>{
        if(r.length < 5 || r[1] === '總計' || r[1] === '單日總計') return;
        const exclude = idxExclude > -1 && (r[idxExclude] === '是' || r[idxExclude] === '1' || r[idxExclude] === 'Y');
        const baseStr = idxBase > -1 ? r[idxBase] : ''; const basePrice = (baseStr === '-' || !baseStr) ? 0 : parseFloat(baseStr) || 0;
        const feeStr = idxFee > -1 ? r[idxFee] : ''; const extraFee = (feeStr === '-' || !feeStr) ? 0 : parseFloat(feeStr) || 0;
        const bonusStr = idxBonus > -1 ? r[idxBonus] : ''; const bonus = (bonusStr === '-' || !bonusStr) ? 0 : parseFloat(bonusStr) || 0;
        const tipStr = idxTip > -1 ? r[idxTip] : ''; const tip = (tipStr === '-' || !tipStr) ? 0 : parseFloat(tipStr) || 0;
        
        let startTs, endTs;
        if(idxStartTs > -1 && idxEndTs > -1 && r[idxStartTs] && !isNaN(Number(r[idxStartTs]))) {
          startTs = Number(r[idxStartTs]); endTs = Number(r[idxEndTs]);
        } else {
          const dateParts = r[2].split('/').map(n => parseInt(n)); let yyyy, mm, dd;
          if(dateParts.length === 3){ [yyyy, mm, dd] = dateParts; }else if(dateParts.length === 2){ [mm, dd] = dateParts; yyyy = currentYear; }else return;
          const [sh, sm] = r[3].split(':').map(n => parseInt(n)); const [eh, em] = r[4].split(':').map(n => parseInt(n));
          startTs = new Date(yyyy, mm - 1, dd, sh || 0, sm || 0, 0).getTime(); endTs = new Date(yyyy, mm - 1, dd, eh || 0, em || 0, 0).getTime();
          if(endTs <= startTs) endTs += 24*60*60*1000;
        }
        const billedMin = getBilledMinutes(startTs, endTs);
        const actualExtraMin = exclude ? 0 : Math.max(0, billedMin - getCoveredMin(basePrice, exclude));
        
        imported.push({ 
          id: genId(), orderNo: r[1] || '', basePrice, excludeBaseFromTotal: exclude, startTs, endTs, 
          elapsedMinCeil: billedMin, extraMin: actualExtraMin, extraFee, bonus, tip, 
          total: (exclude ? 0 : basePrice) + extraFee + bonus + tip 
        });
      });
      if(imported.length === 0){ showImportStatus('沒有讀到可匯入的紀錄'); e.target.value=''; return; }
      orders = orders.concat(imported).sort((a,b) => b.startTs - a.startTs);
      saveJSON(KEY_ORDERS, orders); computeTodaySummary(); computeWeeklyData(); renderWeeklyTab(); renderDetailTable(); 
      showImportStatus(`已匯入 ${imported.length} 筆紀錄`);
    }catch(err){ showImportStatus('匯入失敗，請確認格式'); }
    e.target.value = '';
  };
  reader.readAsText(file, 'UTF-8');
});

if('serviceWorker' in navigator){ window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }); }
